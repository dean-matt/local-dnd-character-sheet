<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Manage Tabs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }
</style>
</helmet>

<div style="width: 360px; height: 560px; box-sizing: border-box; padding: 32px; display: flex; align-items: center; justify-content: center; background: #f4f5f7; position: relative;">
  <div style="width: 100%; background: #ffffff; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 24px 48px rgba(0, 0, 0, 0.18);">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 15px; font-weight: 700; color: #1f2430;">Manage Tabs</div>
      <button aria-label="Close" onClick="{{close}}" style="width: 24px; height: 24px; border: none; background: none; color: #6b7280; font-size: 16px; line-height: 1;">&times;</button>
    </div>
    <div style="font-size: 11px; color: #6b7280;">Reorder or show/hide any tab; rename and delete apply to tabs you added.</div>
    <div style="display: flex; flex-direction: column; gap: 2px; max-height: 340px; overflow-y: auto;">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
        <div draggable="true" onDragStart="{{row.onDragStart}}" onDragOver="{{row.onDragOver}}" onDrop="{{row.onDrop}}" style="display: flex; align-items: center; gap: 6px; padding: 6px 4px; border-radius: 4px; border: 1px solid {{row.borderColor}};">
          <span title="Drag to reorder" style="cursor: grab; flex-shrink: 0; display: flex; color: #9aa1ab;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.4"/><circle cx="8" cy="12" r="1.4"/><circle cx="8" cy="18" r="1.4"/><circle cx="16" cy="6" r="1.4"/><circle cx="16" cy="12" r="1.4"/><circle cx="16" cy="18" r="1.4"/></svg>
          </span>
          <sc-if value="{{row.custom}}" hint-placeholder-val="{{false}}">
            <label for="tabRename-{{row.id}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Rename {{row.label}}</label>
            <input id="tabRename-{{row.id}}" type="text" value="{{row.label}}" onChange="{{row.onRename}}" style="flex-grow: 1; min-width: 0; padding: 4px 6px; border: 1px solid transparent; border-radius: 3px; font-size: 13px; color: {{row.textColor}}; background: none;">
          </sc-if>
          <sc-if value="{{row.builtIn}}" hint-placeholder-val="{{true}}">
            <span title="Built-in tab — reorder or hide, but not rename" style="flex-grow: 1; min-width: 0; padding: 4px 6px; font-size: 13px; color: {{row.textColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{row.label}}</span>
          </sc-if>
          <button aria-label="{{row.visibilityLabel}}" title="{{row.visibilityLabel}}" onClick="{{row.toggleHidden}}" style="width: 24px; height: 24px; border: none; background: none; color: #6b7280; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <sc-if value="{{row.hidden}}" hint-placeholder-val="{{false}}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0112 5c6 0 10 6 10 6a17.5 17.5 0 01-3.2 3.9M6.6 6.6C3.9 8.3 2 12 2 12s4 6 10 6a9.8 9.8 0 004.4-1"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>
            </sc-if>
            <sc-if value="{{row.visible}}" hint-placeholder-val="{{true}}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </sc-if>
          </button>
          <sc-if value="{{row.custom}}" hint-placeholder-val="{{false}}">
            <button aria-label="Delete {{row.label}}" onClick="{{row.confirmRemove}}" style="width: 24px; height: 24px; border: none; background: none; color: #6b7280; font-size: 16px; line-height: 1; flex-shrink: 0;">&times;</button>
          </sc-if>
        </div>
      </sc-for>
    </div>
    <button onClick="{{addTab}}" style="display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 4px; padding: 8px; border-radius: 6px; border: 1px dashed {{accent}}; background: none; color: {{accent}}; font-size: 13px; font-weight: 600;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.5" style="flex-shrink: 0;"><path d="M12 5v14M5 12h14"/></svg>
      Add Tab
    </button>
  </div>

  <sc-if value="{{confirmOpen}}" hint-placeholder-val="{{false}}">
    <div role="presentation" onClick="{{cancelRemove}}" style="position: fixed; inset: 0; background: rgba(15,17,21,0.5); display: flex; align-items: center; justify-content: center; z-index: 50;">
      <div onClick="{{stopPropagation}}">
        <dc-import name="ConfirmDialog" open="{{confirmOpen}}" message="{{confirmMessage}}" on-confirm="{{doRemove}}" on-cancel="{{cancelRemove}}" accent="{{accent}}" hint-size="340px,200px"></dc-import>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tabs":{"editor":null},"onChange":{"editor":null},"onAddTab":{"editor":null},"onClose":{"editor":null},"accent":{"editor":"color","default":"#c1272d"},"$preview":{"width":360,"height":560}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dragTabId: null, confirmDeleteId: null };
  }
  renderVals() {
    const accent = this.props.accent ?? '#c1272d';
    const tabs = this.props.tabs || [];
    const onChange = this.props.onChange || (() => {});
    const onAddTab = this.props.onAddTab || (() => {});
    const onClose = this.props.onClose || (() => {});
    const { dragTabId, confirmDeleteId } = this.state;

    const reorder = (dragId, dropId) => {
      const i1 = tabs.findIndex((t) => t.id === dragId);
      const i2 = tabs.findIndex((t) => t.id === dropId);
      if (i1 === -1 || i2 === -1 || i1 === i2) return;
      const next = tabs.slice();
      const [moved] = next.splice(i1, 1);
      next.splice(i2, 0, moved);
      onChange(next);
      this.setState({ dragTabId: null });
    };

    const rows = tabs.map((t) => ({
      id: t.id,
      label: t.label,
      custom: t.custom,
      builtIn: !t.custom,
      hidden: t.hidden,
      visible: !t.hidden,
      textColor: t.hidden ? '#9aa1ab' : '#1f2430',
      borderColor: dragTabId && dragTabId !== t.id ? accent : '#eceef1',
      visibilityLabel: t.hidden ? 'Show ' + t.label : 'Hide ' + t.label,
      onRename: (e) => onChange(tabs.map((x) => (x.id === t.id ? { ...x, label: e.target.value } : x))),
      toggleHidden: () => onChange(tabs.map((x) => (x.id === t.id ? { ...x, hidden: !x.hidden } : x))),
      confirmRemove: () => this.setState({ confirmDeleteId: t.id }),
      onDragStart: () => this.setState({ dragTabId: t.id }),
      onDragOver: (e) => e.preventDefault(),
      onDrop: (e) => {
        e.preventDefault();
        if (dragTabId) reorder(dragTabId, t.id);
      }
    }));

    const deleting = tabs.find((t) => t.id === confirmDeleteId);

    return {
      accent,
      rows,
      addTab: onAddTab,
      close: () => onClose(),
      confirmOpen: !!deleting,
      confirmMessage: deleting ? 'Delete "' + deleting.label + '"? This cannot be undone.' : '',
      doRemove: () => {
        onChange(tabs.filter((x) => x.id !== confirmDeleteId));
        this.setState({ confirmDeleteId: null });
      },
      cancelRemove: () => this.setState({ confirmDeleteId: null }),
      stopPropagation: (e) => e.stopPropagation()
    };
  }
}
</script>
</body>
</html>
