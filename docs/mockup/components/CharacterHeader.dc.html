<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Character Header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</helmet>

<div style="width: 1200px; height: 160px; display: flex; flex-direction: column; background: #f4f5f7;">
  <div style="width: 100%; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 40px; background: #ffffff; border-bottom: 1px solid #dde1e6;">
    <div style="position: relative; width: 32px; height: 32px; flex-shrink: 0;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #3f5d44; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px;">E</div>
      <label for="avatarUpload" aria-label="Upload avatar image" style="position: absolute; bottom: -3px; right: -3px; width: 14px; height: 14px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center; border: 1.5px solid #ffffff; cursor: pointer;">
        <span aria-hidden="true" style="position: absolute; top: -6.5px; right: -6.5px; bottom: -6.5px; left: -6.5px;"></span>
        <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="14" r="3.2"/></svg>
      </label>
      <input id="avatarUpload" type="file" accept="image/*" class="vh">
    </div>
    <div style="flex-grow: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px;">
      <h1 title="{{name}}" style="margin: 0; flex: 0 1 auto; max-width: 40%; min-width: 0; font-weight: 700; font-size: 18px; color: #1f2430; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{name}}</h1>
      <span title="This character uses the 2014 rules" style="align-self: center; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #4b5260; background: #f4f5f7; border: 1px solid #dde1e6; border-radius: 4px; padding: 2px 5px; flex-shrink: 0;">2014</span>
      <span aria-hidden="true" style="font-size: 13px; color: #6b7280; flex-shrink: 0;">·</span>
      <div title="{{subtitle}}" style="flex: 1 1 0; min-width: 0; font-size: 13px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{subtitle}}</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
      <button aria-label="Inspiration" aria-pressed="{{inspiration}}" title="Inspiration: spend for advantage on one roll" onClick="{{toggleInspiration}}" style="width: 32px; height: 32px; padding: 0; border-radius: 6px; border: 1px solid {{inspirationBorder}}; background: {{inspirationBg}}; display: flex; align-items: center; justify-content: center;">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="{{inspirationFill}}" stroke="{{inspirationColor}}" stroke-width="2"><path d="M13 2 4 14h6l-1 8 10-13h-6l1-7z"/></svg>
      </button>
      <div style="position: relative;">
        <button title="Take a short or long rest" aria-expanded="{{restOpen}}" onClick="{{toggleRest}}" style="display: flex; align-items: center; gap: 6px; padding: 0 10px; height: 32px; border-radius: 6px; border: 1px solid #dde1e6; background: #ffffff;">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><path d="M12 3c2 3-1 4-1 6.5a2.5 2.5 0 005 0C17.5 6 15 4.5 15 2c2.5 2 5 5.5 5 9.5a8 8 0 11-16 0C4 7.5 8.5 5 12 3z"/><path d="M3 21l4.5-4.5M21 21l-4.5-4.5M8 21h8"/></svg>
          <span style="font-size: 12px; font-weight: 600; color: #6b7280;">Rest</span>
        </button>
        <sc-if value="{{restOpen}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; top: calc(100% + 4px); right: 0; width: 200px; background: #ffffff; border: 1px solid #dde1e6; border-radius: 8px; box-shadow: 0 16px 32px rgba(0, 0, 0, 0.18); padding: 6px; z-index: 40;">
            <button onClick="{{shortRest}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 4px; border: none; background: none;">
              <span style="font-size: 13px; font-weight: 600; color: #1f2430;">Short Rest</span>
              <span style="font-size: 11px; color: #6b7280;">Spend Hit Dice to recover HP</span>
            </button>
            <button onClick="{{longRest}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 4px; border: none; background: none;">
              <span style="font-size: 13px; font-weight: 600; color: #1f2430;">Long Rest</span>
              <span style="font-size: 11px; color: #6b7280;">Restore HP, Hit Dice and spent resources</span>
            </button>
          </div>
        </sc-if>
      </div>
      <div style="position: relative;">
        <button aria-label="Character menu" onClick="{{toggleMenu}}" style="width: 32px; height: 32px; padding: 0; border-radius: 6px; border: 1px solid #dde1e6; background: #ffffff; display: flex; align-items: center; justify-content: center;">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#6b7280"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
        <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; top: calc(100% + 4px); right: 0; width: 180px; background: #ffffff; border: 1px solid #dde1e6; border-radius: 8px; box-shadow: 0 16px 32px rgba(0, 0, 0, 0.18); padding: 6px; z-index: 40;">
            <button style="display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 4px; border: none; background: none; font-size: 13px; color: #1f2430;">Duplicate Character</button>
            <button style="display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 4px; border: none; background: none; font-size: 13px; color: {{accent}};">Delete Character</button>
          </div>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c1272d"},"longText":{"editor":"boolean","default":false},"$preview":{"width":1200,"height":160}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { inspiration: false, menuOpen: false, restOpen: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#c1272d';
    const on = this.state.inspiration;
    const long = this.props.longText ?? false;
    return {
      accent,
      name: long ? 'Elara Nightshade, Warden of the Silverwood' : 'Elara Nightshade',
      subtitle: long
        ? 'Half-Elf Ranger 7 (Hunter) / Rogue 3 (Thief) • Folk Hero • Chaotic Good • Corellon Larethian (Elven)'
        : 'Half-Elf Ranger 7 (Hunter) • Folk Hero • Chaotic Good',
      inspiration: on,
      inspirationBorder: on ? accent : '#dde1e6',
      inspirationBg: on ? '#fdf3ea' : '#ffffff',
      inspirationFill: on ? accent : 'none',
      inspirationColor: on ? accent : '#6b7280',
      toggleInspiration: () => this.setState({ inspiration: !on }),
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen, restOpen: false }),
      restOpen: this.state.restOpen,
      toggleRest: () => this.setState({ restOpen: !this.state.restOpen, menuOpen: false }),
      shortRest: () => this.setState({ restOpen: false }),
      longRest: () => this.setState({ restOpen: false })
    };
  }
}
</script>
</body>
</html>
