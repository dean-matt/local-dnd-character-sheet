<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Character Header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</helmet>

<div style="width: 1200px; height: 160px; box-sizing: border-box; padding: 24px 40px; display: flex; align-items: center; background: #f4f5f7;">
  <div style="width: 100%; display: flex; align-items: center; gap: 20px;">
    <div style="position: relative; width: 72px; height: 72px; flex-shrink: 0;">
      <div style="width: 72px; height: 72px; border-radius: 50%; background: #3f5d44; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 30px;">E</div>
      <label for="avatarUpload" aria-label="Upload avatar image" style="position: absolute; bottom: -2px; right: -2px; width: 24px; height: 24px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center; border: 2px solid #ffffff; cursor: pointer;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.3"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="14" r="3.2"/></svg>
      </label>
      <input id="avatarUpload" type="file" accept="image/*" class="vh">
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
      <div style="font-weight: 700; font-size: 28px; color: #1f2430;">Elara Nightshade</div>
      <div style="font-size: 14px; color: #6b7280;">Half-Elf Ranger 7 • Folk Hero</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <button aria-label="Toggle inspiration" title="Inspiration: spend for advantage on one roll" onClick="{{toggleInspiration}}" style="display: flex; align-items: center; gap: 6px; padding: 0 12px; height: 36px; border-radius: 8px; border: 1px solid {{inspirationBorder}}; background: {{inspirationBg}};">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="{{inspirationFill}}" stroke="{{inspirationColor}}" stroke-width="2"><path d="M13 2 4 14h6l-1 8 10-13h-6l1-7z"/></svg>
        <span style="font-size: 12px; font-weight: 600; color: {{inspirationColor}};">Inspiration</span>
      </button>
      <div style="position: relative;">
        <button aria-label="Character menu" onClick="{{toggleMenu}}" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid #dde1e6; background: #ffffff; display: flex; align-items: center; justify-content: center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1h.1a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
        </button>
        <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; top: calc(100% + 4px); right: 0; width: 180px; background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; box-shadow: 0 16px 32px rgba(0, 0, 0, 0.18); padding: 6px; z-index: 40;">
            <button style="display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; border: none; background: none; font-size: 13px; color: #1f2430;">Duplicate Character</button>
            <button style="display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; border: none; background: none; font-size: 13px; color: {{accent}};">Delete Character</button>
          </div>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c1272d"},"$preview":{"width":1200,"height":160}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { inspiration: false, menuOpen: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#c1272d';
    const on = this.state.inspiration;
    return {
      accent,
      inspirationBorder: on ? accent : '#dde1e6',
      inspirationBg: on ? '#fdf3ea' : '#ffffff',
      inspirationFill: on ? accent : 'none',
      inspirationColor: on ? accent : '#6b7280',
      toggleInspiration: () => this.setState({ inspiration: !on }),
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen })
    };
  }
}
</script>
</body>
</html>
