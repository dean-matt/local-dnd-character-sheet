<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Hit Points</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }
  input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }
</style>
</helmet>

<div style="width: 420px; height: 340px; box-sizing: border-box; padding: 32px; display: flex; align-items: center; background: #f4f5f7;">
  <div style="width: 100%; background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #6b7280; text-transform: uppercase;">Hit Points</div>
    <div style="display: flex; align-items: baseline; gap: 6px;">
      <div style="font-size: 26px; font-weight: 700; color: #1f2430;">{{hpCur}}</div>
      <div style="font-size: 15px; color: #6b7280;">/ {{hpMax}}</div>
      <sc-if value="{{hasTempHp}}" hint-placeholder-val="{{false}}">
        <div title="Temporary hit points &mdash; absorb damage before real HP" style="font-size: 12px; font-weight: 600; color: #2f6b4f;">+{{tempHp}} temp</div>
      </sc-if>
      <div style="font-size: 11px; color: #6b7280; margin-left: auto;">Hit Dice {{hitDice}}</div>
    </div>
    <div style="width: 100%; height: 8px; border-radius: 999px; background: #eceef1; overflow: hidden;">
      <div style="width: {{hpPct}}%; height: 100%; background: {{accent}};"></div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <label for="hpAmount" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Amount</label>
      <input id="hpAmount" type="number" min="0" placeholder="0" value="{{dmgInput}}" onChange="{{onDmgInputChange}}" style="width: 64px; padding: 6px 8px; border: 1px solid #dde1e6; border-radius: 6px; font-size: 13px; background: #ffffff; color: #1f2430;">
      <button onClick="{{applyDamage}}" style="padding: 6px 12px; border-radius: 6px; border: 1px solid {{accent}}; background: #ffffff; color: {{accent}}; font-size: 12px; font-weight: 600;">&minus; Damage</button>
      <button onClick="{{applyHeal}}" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #2f6b4f; background: #ffffff; color: #2f6b4f; font-size: 12px; font-weight: 600;">+ Heal</button>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <label for="tempHpInput" style="font-size: 11px; color: #6b7280;">Temp HP</label>
      <input id="tempHpInput" type="number" min="0" value="{{tempHp}}" onChange="{{onTempHpChange}}" style="width: 56px; padding: 5px 6px; border: 1px solid #dde1e6; border-radius: 6px; font-size: 12px; background: #ffffff; color: #1f2430;">
    </div>
    <div style="display: flex; gap: 8px; padding-top: 4px; border-top: 1px solid #dde1e6;">
      <button onClick="{{shortRest}}" title="Roll a Hit Die + CON modifier to heal" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #dde1e6; background: #eceef1; color: #1f2430; font-size: 12px; font-weight: 600;">Short Rest</button>
      <button onClick="{{longRest}}" title="Restore all HP" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #dde1e6; background: #eceef1; color: #1f2430; font-size: 12px; font-weight: 600;">Long Rest</button>
    </div>
    <sc-if value="{{hasRoll}}" hint-placeholder-val="{{false}}">
      <div style="font-size: 12px; color: #6b7280;">{{rollText}}</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#d9730d"},"$preview":{"width":420,"height":340}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hpCur: 54, hpMax: 58, tempHp: 0, hitDice: '7d10', conScore: 14, dmgInput: '', lastRoll: null };
  }
  renderVals() {
    const accent = this.props.accent ?? '#d9730d';
    const mod = (s) => Math.floor((s - 10) / 2);
    const { hpCur, hpMax, tempHp, hitDice, conScore, dmgInput } = this.state;
    const amount = parseInt(dmgInput, 10) || 0;
    const hpPct = Math.max(0, Math.min(100, Math.round((hpCur / hpMax) * 100)));
    return {
      accent,
      hpCur,
      hpMax,
      hpPct,
      hitDice,
      tempHp,
      hasTempHp: !!tempHp,
      dmgInput,
      onDmgInputChange: (e) => this.setState({ dmgInput: e.target.value }),
      applyDamage: () => {
        const fromTemp = Math.min(tempHp || 0, amount);
        const remaining = amount - fromTemp;
        this.setState({ hpCur: Math.max(0, hpCur - remaining), tempHp: (tempHp || 0) - fromTemp, dmgInput: '' });
      },
      applyHeal: () => this.setState({ hpCur: Math.min(hpMax, hpCur + amount), dmgInput: '' }),
      onTempHpChange: (e) => this.setState({ tempHp: Math.max(0, parseInt(e.target.value, 10) || 0) }),
      shortRest: () => {
        const dieSize = parseInt((hitDice || '1d8').split('d')[1], 10) || 8;
        const roll = 1 + Math.floor(Math.random() * dieSize);
        const conMod = mod(conScore);
        const healed = Math.max(1, roll + conMod);
        this.setState({ hpCur: Math.min(hpMax, hpCur + healed), lastRoll: { text: 'Short Rest (1d' + dieSize + ' + ' + conMod + '): ' + roll + ' → healed ' + healed } });
      },
      longRest: () => this.setState({ hpCur: hpMax, lastRoll: { text: 'Long Rest: HP fully restored' } }),
      hasRoll: !!this.state.lastRoll,
      rollText: this.state.lastRoll ? this.state.lastRoll.text : ''
    };
  }
}
</script>
</body>
</html>
