<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filter — Rolls Panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  label, select { font-family: inherit; }
</style>
</helmet>

<div style="width: 220px; background: #ffffff; border: 1px solid #dde1e6; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 12px 24px rgba(0,0,0,0.18);">
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6b7280;">Filter Rolls</div>
    <button aria-label="Close filter" onClick="{{close}}" style="border: none; background: none; font-size: 16px; line-height: 1; color: #6b7280; padding: 0;">&times;</button>
  </div>

  <div>
    <div style="font-size: 11px; font-weight: 600; color: #6b7280; margin-bottom: 6px;">Character</div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px;">
      <sc-for list="{{characterChips}}" as="chip" hint-placeholder-count="1">
        <div style="display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 4px 3px 10px; border-radius: 999px; background: #eceef1; border: 1px solid #dde1e6; color: #1f2430;">
          {{chip.label}}
          <button aria-label="Remove {{chip.label}}" onClick="{{chip.remove}}" style="width: 14px; height: 14px; border: none; background: none; color: #6b7280; font-size: 12px; line-height: 1; padding: 0;">&times;</button>
        </div>
      </sc-for>
      <sc-if value="{{characterEmpty}}" hint-placeholder-val="{{true}}">
        <div style="font-size: 12px; color: #9aa1ab; font-style: italic;">Showing all</div>
      </sc-if>
    </div>
    <sc-if value="{{characterHasHidden}}" hint-placeholder-val="{{true}}">
      <select onChange="{{onCharacterAdd}}" value="" aria-label="Narrow by character" style="width: 100%; padding: 6px 8px; border: 1px solid #dde1e6; border-radius: 6px; font-size: 12px; background: #ffffff; color: #1f2430;">
        <option value="" disabled>+ Narrow to character…</option>
        <sc-for list="{{characterHiddenOptions}}" as="opt" hint-placeholder-count="1">
          <option value="{{opt.value}}">{{opt.label}}</option>
        </sc-for>
      </select>
    </sc-if>
  </div>

  <div style="border-top: 1px solid #dde1e6; padding-top: 8px;">
    <div style="font-size: 11px; font-weight: 600; color: #6b7280; margin-bottom: 6px;">Roll Type</div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px;">
      <sc-for list="{{typeChips}}" as="chip" hint-placeholder-count="1">
        <div style="display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 4px 3px 10px; border-radius: 999px; background: #eceef1; border: 1px solid #dde1e6; color: #1f2430;">
          {{chip.label}}
          <button aria-label="Remove {{chip.label}}" onClick="{{chip.remove}}" style="width: 14px; height: 14px; border: none; background: none; color: #6b7280; font-size: 12px; line-height: 1; padding: 0;">&times;</button>
        </div>
      </sc-for>
      <sc-if value="{{typeEmpty}}" hint-placeholder-val="{{true}}">
        <div style="font-size: 12px; color: #9aa1ab; font-style: italic;">Showing all</div>
      </sc-if>
    </div>
    <sc-if value="{{typeHasHidden}}" hint-placeholder-val="{{true}}">
      <select onChange="{{onTypeAdd}}" value="" aria-label="Narrow by roll type" style="width: 100%; padding: 6px 8px; border: 1px solid #dde1e6; border-radius: 6px; font-size: 12px; background: #ffffff; color: #1f2430;">
        <option value="" disabled>+ Narrow to type…</option>
        <sc-for list="{{typeHiddenOptions}}" as="opt" hint-placeholder-count="1">
          <option value="{{opt.value}}">{{opt.label}}</option>
        </sc-for>
      </select>
    </sc-if>
  </div>

  <button onClick="{{reset}}" style="align-self: flex-start; border: none; background: none; font-size: 12px; font-weight: 600; color: {{accent}}; padding: 0;">Reset</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"filters":{"editor":null},"onChange":{"editor":null},"onClose":{"editor":null},"accent":{"editor":"color","default":"#c1272d"},"$preview":{"width":220,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#c1272d';
    const CHARACTERS = ['Mira Stormwind', 'Kaelen Ashwood'];
    const TYPES = ['Attack', 'Damage', 'Check', 'Save', 'Spell Atk', 'Spell Dmg'];
    const DEFAULT = { characters: [], types: [] };
    const filters = this.props.filters || DEFAULT;
    const onChange = this.props.onChange || (() => {});
    const onClose = this.props.onClose || (() => {});
    const set = (next) => onChange({ ...filters, ...next });
    const makeFacet = (selected, allKeys, apply) => {
      const hidden = allKeys.filter((k) => selected.indexOf(k) === -1);
      return {
        chips: selected.map((k) => ({ label: k, remove: () => apply(selected.filter((x) => x !== k)) })),
        isEmpty: selected.length === 0,
        hasHidden: hidden.length > 0,
        hiddenOptions: hidden.map((k) => ({ value: k, label: k })),
        onAdd: (e) => { const k = e.target.value; if (k) apply([...selected, k]); }
      };
    };
    const characterFacet = makeFacet(filters.characters, CHARACTERS, (next) => set({ characters: next }));
    const typeFacet = makeFacet(filters.types, TYPES, (next) => set({ types: next }));
    return {
      accent,
      characterChips: characterFacet.chips,
      characterEmpty: characterFacet.isEmpty,
      characterHasHidden: characterFacet.hasHidden,
      characterHiddenOptions: characterFacet.hiddenOptions,
      onCharacterAdd: characterFacet.onAdd,
      typeChips: typeFacet.chips,
      typeEmpty: typeFacet.isEmpty,
      typeHasHidden: typeFacet.hasHidden,
      typeHiddenOptions: typeFacet.hiddenOptions,
      onTypeAdd: typeFacet.onAdd,
      reset: () => onChange(DEFAULT),
      close: () => onClose()
    };
  }
}
</script>
</body>
</html>
