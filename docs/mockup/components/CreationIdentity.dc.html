<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Creation: Identity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }
  input::placeholder { color: #9aa1ab; }
</style>
</helmet>

<div style="width: 1440px; height: 800px; display: flex; flex-direction: column; background: #f4f5f7;">
  <div style="flex-shrink: 0; height: 64px; display: flex; align-items: center; gap: 6px; padding: 0 24px; background: #ffffff; border-bottom: 1px solid #dde1e6;">
    <div style="font-weight: 700; font-size: 18px; color: {{accent}}; margin-right: 14px;">Local D&amp;D</div>
    <button style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: none; border-radius: 4px; background: none; font-size: 14px; font-weight: 700; color: {{accent}}; text-decoration: none;">
      Character
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <a href="SettingsSidebar.dc.html" style="margin-left: auto; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: none; border-radius: 4px; background: none; font-size: 14px; font-weight: 500; color: #4b5260; text-decoration: none;">
      Settings
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1h.1a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </a>
  </div>

  <div style="flex-grow: 1; display: flex; min-height: 0;">
    <nav aria-label="Creation steps" style="width: 260px; flex-shrink: 0; background: #ffffff; border-right: 1px solid #dde1e6; padding: 20px 16px; display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280; padding: 0 10px 6px 10px;">New Character</div>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px;">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
          <li>
            <sc-if value="{{s.reachable}}" hint-placeholder-val="{{true}}">
              <a href="{{s.href}}" aria-current="{{s.ariaCurrent}}" style="display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 6px; background: {{s.rowBg}}; text-decoration: none;">
                <span style="width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: {{s.badgeBg}}; color: {{s.badgeColor}}; border: 1px solid {{s.badgeBorder}};">{{s.mark}}</span>
                <span style="font-size: 14px; font-weight: {{s.textWeight}}; color: {{s.textColor}};">{{s.label}}</span>
              </a>
            </sc-if>
            <sc-if value="{{s.locked}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; align-items: center; gap: 12px; padding: 9px 10px;">
                <span style="width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #ffffff; color: #6b7280; border: 1px solid #dde1e6;">{{s.mark}}</span>
                <span style="font-size: 14px; font-weight: 500; color: #6b7280;">{{s.label}}</span>
              </div>
            </sc-if>
          </li>
        </sc-for>
      </ol>
      <div style="flex-grow: 1;"></div>
      <div style="border-top: 1px solid #dde1e6; padding-top: 12px;">
        <a href="CharacterList.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; font-size: 13px; font-weight: 500; color: #4b5260; text-decoration: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" style="flex-shrink: 0;"><path d="M6 6l12 12M18 6L6 18"/></svg>
          Cancel
        </a>
      </div>
    </nav>

    <div style="flex-grow: 1; min-width: 0; min-height: 0; padding: 24px 40px; display: flex; flex-direction: column; gap: 14px;">
    <div>
      <div style="font-size: 12px; color: #6b7280; margin-bottom: 2px;">Step {{stepNum}} of 5</div>
      <div style="font-size: 22px; font-weight: 700;">Identity</div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 28px; overflow-y: auto; flex-grow: 1; padding-top: 4px;">
      <div style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <label for="charName" style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 6px;">Name</label>
        <input id="charName" type="text" placeholder="Character name…" value="{{name}}" onChange="{{onName}}" style="width: 100%; padding: 8px 10px; border: 1px solid #dde1e6; border-radius: 8px; font-size: 14px; background: #ffffff; color: #1f2430;">
      </div>

      <div>
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 6px;">Race</div>
        <sc-if value="{{hasRace}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; align-items: center; gap: 4px; font-size: 13px; padding: 6px 6px 6px 12px; border-radius: 999px; background: #eceef1; border: 1px solid #dde1e6; color: #1f2430; width: fit-content;">
            {{race}}
            <button aria-label="Change race" onClick="{{clearRace}}" style="width: 16px; height: 16px; border: none; background: none; color: #6b7280; font-size: 13px; line-height: 1; padding: 0;">&times;</button>
          </div>
        </sc-if>
        <sc-if value="{{noRace}}" hint-placeholder-val="{{false}}">
          <div style="position: relative;">
            <label for="raceSearch" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search races</label>
            <input id="raceSearch" type="text" placeholder="Choose a race…" value="{{raceQuery}}" onChange="{{onRaceQueryChange}}" style="width: 100%; padding: 7px 10px; border: 1px solid #dde1e6; border-radius: 8px; font-size: 13px; background: #ffffff; color: #1f2430;">
            <div style="position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; box-shadow: 0 16px 32px rgba(0, 0, 0, 0.18); padding: 6px; max-height: 200px; overflow-y: auto; z-index: 30;">
              <sc-for list="{{raceMatches}}" as="m" hint-placeholder-count="4">
                <button onClick="{{m.pick}}" style="display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; border: none; background: none; font-size: 13px; color: #1f2430;">{{m.name}}</button>
              </sc-for>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{needsSubrace}}" hint-placeholder-val="{{false}}">
          <div style="margin-top: 8px;">
            <div style="font-size: 11px; color: {{accent}}; font-weight: 600; margin-bottom: 6px;">{{race}} has subraces — choose one to continue</div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px;">
              <sc-for list="{{subraceOptions}}" as="sr" hint-placeholder-count="3">
                <button onClick="{{sr.pick}}" style="padding: 6px 12px; border-radius: 999px; border: 1px solid #dde1e6; background: #ffffff; color: #1f2430; font-size: 12px; font-weight: 600;">{{sr.name}}</button>
              </sc-for>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{hasSubrace}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 5px 5px 5px 10px; border-radius: 999px; background: #eceef1; border: 1px solid #dde1e6; color: #1f2430; width: fit-content; margin-top: 6px;">
            {{subrace}}
            <button aria-label="Change subrace" onClick="{{clearSubrace}}" style="width: 14px; height: 14px; border: none; background: none; color: #6b7280; font-size: 12px; line-height: 1; padding: 0;">&times;</button>
          </div>
        </sc-if>
      </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 6px;">Background</div>
        <sc-if value="{{hasBackground}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; align-items: center; gap: 4px; font-size: 13px; padding: 6px 6px 6px 12px; border-radius: 999px; background: #eceef1; border: 1px solid #dde1e6; color: #1f2430; width: fit-content;">
            {{background}}
            <button aria-label="Change background" onClick="{{clearBackground}}" style="width: 16px; height: 16px; border: none; background: none; color: #6b7280; font-size: 13px; line-height: 1; padding: 0;">&times;</button>
          </div>
          <div style="font-size: 11px; color: #6b7280; margin-top: 6px;">Grants: {{backgroundGrants}}</div>
        </sc-if>
        <sc-if value="{{noBackground}}" hint-placeholder-val="{{false}}">
          <div style="position: relative;">
            <label for="backgroundSearch" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search backgrounds</label>
            <input id="backgroundSearch" type="text" placeholder="Choose a background…" value="{{backgroundQuery}}" onChange="{{onBackgroundQueryChange}}" style="width: 100%; padding: 7px 10px; border: 1px solid #dde1e6; border-radius: 8px; font-size: 13px; background: #ffffff; color: #1f2430;">
            <div style="position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; box-shadow: 0 16px 32px rgba(0, 0, 0, 0.18); padding: 6px; max-height: 220px; overflow-y: auto; z-index: 30;">
              <sc-for list="{{backgroundMatches}}" as="m" hint-placeholder-count="4">
                <button onClick="{{m.pick}}" style="display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; border: none; background: none;">
                  <span style="font-size: 13px; color: #1f2430;">{{m.name}}</span>
                  <span style="font-size: 11px; color: #6b7280; display: block;">Grants {{m.grants}}</span>
                </button>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </div>

      <div>
        <label for="alignmentSelect" style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 6px;">Alignment</label>
        <select id="alignmentSelect" value="{{alignment}}" onChange="{{onAlignment}}" style="width: 100%; padding: 8px 10px; border: 1px solid #dde1e6; border-radius: 8px; font-size: 14px; background: #ffffff; color: #1f2430;">
          <option value="Lawful Good">Lawful Good</option>
          <option value="Neutral Good">Neutral Good</option>
          <option value="Chaotic Good">Chaotic Good</option>
          <option value="Lawful Neutral">Lawful Neutral</option>
          <option value="True Neutral">True Neutral</option>
          <option value="Chaotic Neutral">Chaotic Neutral</option>
          <option value="Lawful Evil">Lawful Evil</option>
          <option value="Neutral Evil">Neutral Evil</option>
          <option value="Chaotic Evil">Chaotic Evil</option>
        </select>
      </div>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; padding-top: 12px; border-top: 1px solid #dde1e6;">
      <button disabled style="padding: 8px 16px; border-radius: 6px; border: 1px solid #dde1e6; background: #f4f5f7; color: #9aa1ab; font-size: 13px; font-weight: 600;">Back</button>
      <button onClick="{{next}}" disabled="{{nextDisabled}}" style="padding: 8px 16px; border-radius: 6px; border: none; background: {{nextBg}}; color: #ffffff; font-size: 13px; font-weight: 600;">Next: Class →</button>
    </div>
  </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c1272d"},"$preview":{"width":1440,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      name: 'Elara Nightshade',
      race: 'Elf',
      subrace: 'High Elf',
      background: 'Sage',
      alignment: 'Chaotic Good',
      raceQuery: '',
      backgroundQuery: ''
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#c1272d';
    const RACES = {
      Dragonborn: [], Dwarf: ['Hill Dwarf', 'Mountain Dwarf'], Elf: ['High Elf', 'Wood Elf', 'Drow'],
      Gnome: ['Forest Gnome', 'Rock Gnome'], 'Half-Elf': [], 'Half-Orc': [],
      Halfling: ['Lightfoot Halfling', 'Stout Halfling'], Human: [], Tiefling: []
    };
    const BACKGROUNDS = {
      Acolyte: 'Insight, Religion', Charlatan: 'Deception, Sleight of Hand', Criminal: 'Deception, Stealth',
      Entertainer: 'Acrobatics, Performance', 'Folk Hero': 'Animal Handling, Survival',
      'Guild Artisan': 'Insight, Persuasion', Hermit: 'Medicine, Religion', Noble: 'History, Persuasion',
      Outlander: 'Athletics, Survival', Sage: 'Arcana, History', Sailor: 'Athletics, Perception',
      Soldier: 'Athletics, Intimidation', Urchin: 'Sleight of Hand, Stealth'
    };
    const { name, race, subrace, background, alignment, raceQuery, backgroundQuery } = this.state;
    const rq = raceQuery.trim().toLowerCase();
    const raceMatches = (rq ? Object.keys(RACES).filter((r) => r.toLowerCase().indexOf(rq) !== -1) : Object.keys(RACES))
      .map((n) => ({ name: n, pick: () => this.setState({ race: n, subrace: '', raceQuery: '' }) }));
    const bq = backgroundQuery.trim().toLowerCase();
    const backgroundMatches = (bq ? Object.keys(BACKGROUNDS).filter((b) => b.toLowerCase().indexOf(bq) !== -1) : Object.keys(BACKGROUNDS))
      .map((n) => ({ name: n, grants: BACKGROUNDS[n], pick: () => this.setState({ background: n, backgroundQuery: '' }) }));
    const subraceList = RACES[race] || [];
    const needsSubrace = !!race && subraceList.length > 0 && !subrace;
    const subraceOptions = subraceList.map((n) => ({ name: n, pick: () => this.setState({ subrace: n }) }));
    const nextDisabled = !name || !race || (subraceList.length > 0 && !subrace) || !background;
    return {
      accent,
      stepNum: 1,
      steps: ['Identity', 'Class', 'Ability Scores', 'Proficiencies & Equipment', 'Spells'].map((label, i) => {
        const n = i + 1;
        const files = ['CreationIdentity.dc.html', 'CreationClass.dc.html', 'CreationAbilityScores.dc.html', 'CreationProficiencies.dc.html', 'CreationSpells.dc.html'];
        const current = n === 1;
        const done = n < 1;
        return {
          label, mark: String(n), href: files[i], reachable: n <= 1, locked: n > 1,
          ariaCurrent: current ? 'step' : 'false',
          rowBg: current ? '#f3e3e0' : 'none',
          textWeight: current ? '600' : '500',
          textColor: current ? '#1f2430' : '#4b5260',
          badgeBg: current ? accent : (done ? '#f3e3e0' : '#ffffff'),
          badgeColor: current ? '#ffffff' : (done ? accent : '#6b7280'),
          badgeBorder: current || done ? accent : '#dde1e6'
        };
      }),
      name,
      onName: (e) => this.setState({ name: e.target.value }),
      hasRace: !!race,
      noRace: !race,
      race,
      clearRace: () => this.setState({ race: '', subrace: '' }),
      raceQuery,
      onRaceQueryChange: (e) => this.setState({ raceQuery: e.target.value }),
      raceMatches,
      needsSubrace,
      subraceOptions,
      hasSubrace: !!subrace,
      subrace,
      clearSubrace: () => this.setState({ subrace: '' }),
      hasBackground: !!background,
      noBackground: !background,
      background,
      backgroundGrants: BACKGROUNDS[background] || '',
      clearBackground: () => this.setState({ background: '' }),
      backgroundQuery,
      onBackgroundQueryChange: (e) => this.setState({ backgroundQuery: e.target.value }),
      backgroundMatches,
      alignment,
      onAlignment: (e) => this.setState({ alignment: e.target.value }),
      nextDisabled,
      nextBg: nextDisabled ? '#dde1e6' : accent,
      next: () => {}
    };
  }
}
</script>
</body>
</html>
