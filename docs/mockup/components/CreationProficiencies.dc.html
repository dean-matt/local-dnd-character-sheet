<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Creation: Proficiencies</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }
</style>
</helmet>

<div style="width: 1440px; height: 800px; display: flex; flex-direction: column; background: #f4f5f7;">
  <div style="flex-shrink: 0; height: 64px; display: flex; align-items: center; gap: 6px; padding: 0 24px; background: #ffffff; border-bottom: 1px solid #dde1e6;">
    <div style="font-weight: 700; font-size: 18px; color: {{accent}}; margin-right: 14px;">Local D&amp;D</div>
    <button style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: none; border-radius: 4px; background: none; font-size: 14px; font-weight: 700; color: {{accent}}; text-decoration: none;">
      Character
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <a href="SettingsSidebar.dc.html" style="margin-left: auto; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: none; border-radius: 4px; background: none; font-size: 14px; font-weight: 500; color: #4b5260; text-decoration: none;">
      Settings
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1h.1a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </a>
  </div>

  <div style="flex-grow: 1; display: flex; min-height: 0;">
    <nav aria-label="Creation steps" style="width: {{railWidth}}; flex-shrink: 0; overflow-x: hidden; transition: width 0.15s ease; background: #ffffff; border-right: 1px solid #dde1e6; padding: 20px 16px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: {{railTextDisplay}}; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280; padding: 0 10px 6px 10px; white-space: nowrap;">New Character</div>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px;">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
          <li>
            <sc-if value="{{s.reachable}}" hint-placeholder-val="{{true}}">
              <a href="{{s.href}}" aria-current="{{s.ariaCurrent}}" aria-label="{{s.label}}" style="display: flex; align-items: center; justify-content: {{railJustify}}; gap: 12px; padding: {{railRowPadding}}; border-radius: 6px; background: {{s.rowBg}}; text-decoration: none;">
                <span style="width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: {{s.badgeBg}}; color: {{s.badgeColor}}; border: 1px solid {{s.badgeBorder}};">{{s.mark}}</span>
                <span style="display: {{railTextDisplay}}; font-size: 14px; font-weight: {{s.textWeight}}; color: {{s.textColor}}; white-space: nowrap;">{{s.label}}</span>
              </a>
            </sc-if>
            <sc-if value="{{s.locked}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; align-items: center; justify-content: {{railJustify}}; gap: 12px; padding: {{railRowPadding}};">
                <span style="width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #ffffff; color: #6b7280; border: 1px solid #dde1e6;">{{s.mark}}</span>
                <span style="display: {{railTextDisplay}}; font-size: 14px; font-weight: 500; color: #6b7280; white-space: nowrap;">{{s.label}}</span>
              </div>
            </sc-if>
          </li>
        </sc-for>
      </ol>
      <div style="flex-grow: 1;"></div>
      <div style="border-top: 1px solid #dde1e6; padding-top: 12px;">
        <button aria-label="{{railToggleLabel}}" aria-expanded="{{railExpanded}}" onClick="{{toggleRail}}" style="display: flex; align-items: center; justify-content: {{railJustify}}; gap: 12px; width: 100%; padding: 9px 10px; border-radius: 6px; border: none; background: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" style="flex-shrink: 0; margin: 0 1.5px; transform: {{railToggleRotation}};"><path d="M15 5l-7 7 7 7"/></svg>
          <span style="display: {{railTextDisplay}}; font-size: 13px; font-weight: 500; color: #6b7280;">Collapse</span>
        </button>
      </div>
    </nav>

    <div style="flex-grow: 1; min-width: 0; min-height: 0; padding: 24px 40px; display: flex; flex-direction: column; gap: 12px;">
    <div>
      <div style="font-size: 12px; color: #6b7280; margin-bottom: 2px;">Step {{stepNum}} of 5</div>
      <div style="font-size: 22px; font-weight: 700;">Proficiencies &amp; Equipment</div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 28px; overflow-y: auto; flex-grow: 1; padding-top: 4px;">
      <div style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 6px;">Granted by Background</div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
          <sc-for list="{{grantedSkills}}" as="g" hint-placeholder-count="2">
            <span style="font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #eceef1; border: 1px solid #dde1e6; color: #1f2430;">{{g}}</span>
          </sc-for>
        </div>
      </div>

      <div>
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 4px;">From Class</div>
        <div style="font-size: 12px; color: {{classCountColor}}; margin-bottom: 8px;">{{classCountLabel}}</div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <sc-for list="{{classSkills}}" as="sk" hint-placeholder-count="6">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{sk.color}}; cursor: {{sk.cursor}}; padding: 4px 2px;">
              <input type="checkbox" checked="{{sk.checked}}" disabled="{{sk.granted}}" onChange="{{sk.toggle}}">
              {{sk.name}}
              <sc-if value="{{sk.granted}}" hint-placeholder-val="{{false}}">
                <span style="font-size: 11px; color: #6b7280;">— granted by Background</span>
              </sc-if>
            </label>
          </sc-for>
        </div>
      </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 6px;">Starting Equipment</div>
        <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #1f2430; margin-bottom: 10px;">
          <input type="checkbox" checked="{{useGold}}" onChange="{{toggleGold}}">
          Take {{goldAlternative}} instead of the equipment below
        </label>
        <sc-if value="{{showEquipmentChoices}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <sc-for list="{{equipmentChoices}}" as="grp" hint-placeholder-count="2">
              <div>
                <div style="font-size: 11px; color: #6b7280; margin-bottom: 4px;">{{grp.label}}</div>
                <div style="display: flex; flex-direction: column; gap: 2px;">
                  <sc-for list="{{grp.options}}" as="opt" hint-placeholder-count="2">
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #1f2430; padding: 3px 2px;">
                      <input type="radio" name="{{grp.name}}" checked="{{opt.checked}}" onChange="{{opt.pick}}">
                      {{opt.label}}
                    </label>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; padding-top: 12px; border-top: 1px solid #dde1e6;">
      <a href="CharacterList.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; color: #4b5260; text-decoration: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        Cancel
      </a>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button onClick="{{back}}" style="padding: 8px 16px; border-radius: 6px; border: 1px solid #dde1e6; background: #ffffff; color: #1f2430; font-size: 13px; font-weight: 600;">← Back</button>
        <button onClick="{{next}}" style="padding: 8px 16px; border-radius: 6px; border: none; background: {{accent}}; color: #ffffff; font-size: 13px; font-weight: 600;">Next: Spells →</button>
      </div>
    </div>
  </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c1272d"},"$preview":{"width":1440,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      railCollapsed: false,
      checkedSkills: { Insight: true, Religion: true },
      useGold: false,
      equipmentPicks: { weapon: 'a quarterstaff', focus: 'a component pouch' }
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#c1272d';
    const grantedSkills = ['Arcana', 'History'];
    const CLASS_SKILL_OPTIONS = ['Arcana', 'History', 'Insight', 'Investigation', 'Medicine', 'Religion'];
    const CLASS_SKILL_COUNT = 2;
    const { checkedSkills, useGold, equipmentPicks } = this.state;
    const checkedCount = Object.values(checkedSkills).filter(Boolean).length;
    const classSkills = CLASS_SKILL_OPTIONS.map((name) => {
      const granted = grantedSkills.indexOf(name) !== -1;
      return {
        name,
        granted,
        checked: granted || !!checkedSkills[name],
        color: granted ? '#6b7280' : '#1f2430',
        cursor: granted ? 'not-allowed' : 'pointer',
        toggle: () => { if (!granted) this.setState({ checkedSkills: { ...checkedSkills, [name]: !checkedSkills[name] } }); }
      };
    });
    const EQUIPMENT_CHOICES = [
      { name: 'weapon', label: 'Choose a weapon', options: ['a quarterstaff', 'a dagger'] },
      { name: 'focus', label: 'Choose a spellcasting focus', options: ['a component pouch', 'an arcane focus'] }
    ];
    const equipmentChoices = EQUIPMENT_CHOICES.map((grp) => ({
      name: grp.name,
      label: grp.label,
      options: grp.options.map((label) => ({
        label,
        checked: equipmentPicks[grp.name] === label,
        pick: () => this.setState({ equipmentPicks: { ...equipmentPicks, [grp.name]: label } })
      }))
    }));
    return {
      accent,
      stepNum: 4,
      railWidth: this.state.railCollapsed ? '72px' : '260px',
      railTextDisplay: this.state.railCollapsed ? 'none' : 'block',
      railJustify: this.state.railCollapsed ? 'center' : 'flex-start',
      railRowPadding: this.state.railCollapsed ? '9px 0' : '9px 10px',
      railExpanded: String(!this.state.railCollapsed),
      railToggleLabel: this.state.railCollapsed ? 'Expand sidebar' : 'Collapse sidebar',
      railToggleRotation: this.state.railCollapsed ? 'rotate(180deg)' : 'rotate(0deg)',
      toggleRail: () => this.setState({ railCollapsed: !this.state.railCollapsed }),
      steps: ['Identity', 'Class', 'Ability Scores', 'Proficiencies & Equipment', 'Spells'].map((label, i) => {
        const n = i + 1;
        const files = [null, 'CreationClass.dc.html', 'CreationAbilityScores.dc.html', 'CreationProficiencies.dc.html', 'CreationSpells.dc.html'];
        const current = n === 4;
        const done = n < 4;
        return {
          label, mark: String(n), href: files[i], reachable: files[i] !== null && n <= 4, locked: files[i] === null || n > 4,
          ariaCurrent: current ? 'step' : 'false',
          rowBg: current ? '#f3e3e0' : 'none',
          textWeight: current ? '600' : '500',
          textColor: current ? '#1f2430' : '#4b5260',
          badgeBg: current ? accent : (done ? '#f3e3e0' : '#ffffff'),
          badgeColor: current ? '#ffffff' : (done ? accent : '#6b7280'),
          badgeBorder: current || done ? accent : '#dde1e6'
        };
      }),
      grantedSkills,
      classSkills,
      classCountLabel: 'Choose ' + CLASS_SKILL_COUNT + ' — ' + checkedCount + ' selected',
      classCountColor: checkedCount === CLASS_SKILL_COUNT ? '#6b7280' : accent,
      useGold,
      goldAlternative: '5d4 × 10 gp',
      toggleGold: () => this.setState({ useGold: !useGold }),
      showEquipmentChoices: !useGold,
      equipmentChoices,
      back: () => {},
      next: () => {}
    };
  }
}
</script>
</body>
</html>
