<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Race</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }
  input::placeholder { color: #9aa1ab; }
</style>
</helmet>

<div style="width: 300px; height: 160px; box-sizing: border-box; padding: 24px; display: flex; align-items: center; background: #f4f5f7;">
  <div style="width: 100%; background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; padding: 16px;">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 8px;">Race</div>

    <sc-if value="{{hasRace}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; align-items: center; gap: 4px; font-size: 13px; padding: 6px 6px 6px 12px; border-radius: 999px; background: #eceef1; border: 1px solid #dde1e6; color: #1f2430; width: fit-content;">
        {{race}}
        <button aria-label="Change race" onClick="{{clearRace}}" style="width: 16px; height: 16px; border: none; background: none; color: #6b7280; font-size: 13px; line-height: 1; padding: 0;">&times;</button>
      </div>
    </sc-if>

    <sc-if value="{{noRace}}" hint-placeholder-val="{{false}}">
      <div style="position: relative;">
        <label for="raceSearch" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search races</label>
        <input id="raceSearch" type="text" placeholder="Choose a race…" value="{{query}}" onChange="{{onQueryChange}}" style="width: 100%; padding: 7px 10px; border: 1px solid #dde1e6; border-radius: 8px; font-size: 13px; background: #ffffff; color: #1f2430;">
        <div style="position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; box-shadow: 0 16px 32px rgba(0, 0, 0, 0.18); padding: 6px; max-height: 200px; overflow-y: auto; z-index: 30;">
          <sc-for list="{{matches}}" as="m" hint-placeholder-count="4">
            <button onClick="{{m.pick}}" style="display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; border: none; background: none; font-size: 13px; color: #1f2430;">{{m.name}}</button>
          </sc-for>
          <sc-if value="{{noMatches}}" hint-placeholder-val="{{false}}">
            <div style="font-size: 12px; color: #6b7280; padding: 8px 10px;">No matching race.</div>
          </sc-if>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":300,"height":160}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { race: 'Half-Elf', query: '' };
  }
  renderVals() {
    const RACES = ['Dragonborn', 'Dwarf', 'Elf', 'Gnome', 'Half-Elf', 'Half-Orc', 'Halfling', 'Human', 'Tiefling'];
    const { race, query } = this.state;
    const q = query.trim().toLowerCase();
    const matches = (q ? RACES.filter((r) => r.toLowerCase().indexOf(q) !== -1) : RACES).map((name) => ({ name, pick: () => this.setState({ race: name, query: '' }) }));
    return {
      hasRace: !!race,
      noRace: !race,
      race,
      clearRace: () => this.setState({ race: '' }),
      query,
      onQueryChange: (e) => this.setState({ query: e.target.value }),
      matches,
      noMatches: matches.length === 0
    };
  }
}
</script>
</body>
</html>
