<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Character List</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
</style>
</helmet>

<div style="width: 1440px; height: 640px; display: flex; flex-direction: column; background: #f4f5f7;">
  <div style="flex-shrink: 0; height: 64px; display: flex; align-items: center; gap: 6px; padding: 0 24px; background: #ffffff; border-bottom: 1px solid #dde1e6;">
    <div style="font-weight: 700; font-size: 18px; color: {{accent}}; margin-right: 14px;">Local D&amp;D</div>
    <button style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: none; border-radius: 4px; background: none; font-size: 14px; font-weight: 700; color: {{accent}}; text-decoration: none;">
      Character
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <a href="SettingsSidebar.dc.html" style="margin-left: auto; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: none; border-radius: 4px; background: none; font-size: 14px; font-weight: 500; color: #4b5260; text-decoration: none;">
      Settings
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1h.1a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </a>
  </div>

  <div style="flex-grow: 1; min-height: 0; padding: 24px 40px; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;">
      <div>
        <h1 style="margin: 0; font-size: 22px; font-weight: 700;">Characters</h1>
        <div style="font-size: 13px; color: #6b7280; margin-top: 2px;">{{countLabel}}</div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button onClick="{{importCharacter}}" style="padding: 8px 14px; border-radius: 6px; border: 1px solid #dde1e6; background: #ffffff; color: #1f2430; font-size: 13px; font-weight: 600;">Import</button>
        <a href="CreationClass.dc.html" style="padding: 8px 14px; border-radius: 6px; background: {{accent}}; color: #ffffff; font-size: 13px; font-weight: 600; text-decoration: none;">+ New Character</a>
      </div>
    </div>

    <sc-if value="{{hasCharacters}}" hint-placeholder-val="{{true}}">
      <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
        <sc-for list="{{characters}}" as="c" hint-placeholder-count="4">
          <li style="min-width: 0;">
            <a href="Layout.dc.html" aria-label="Open {{c.name}}" style="display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 8px; border: 1px solid #dde1e6; background: #ffffff; text-decoration: none; color: inherit;">
              <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <sc-if value="{{c.hasAvatar}}" hint-placeholder-val="{{true}}">
                  <img src="{{c.avatar}}" alt="" width="48" height="48" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0;">
                </sc-if>
                <sc-if value="{{c.noAvatar}}" hint-placeholder-val="{{false}}">
                  <div style="width: 48px; height: 48px; border-radius: 50%; background: {{c.color}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px; flex-shrink: 0;">{{c.initial}}</div>
                </sc-if>
                <span style="font-size: 9px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #4b5260; background: #f4f5f7; border: 1px solid #dde1e6; border-radius: 4px; padding: 3px 6px; flex-shrink: 0;">{{c.edition}}</span>
              </div>
              <div style="font-size: 15px; font-weight: 600; color: #1f2430; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.name}}</div>
              <div style="font-size: 12px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.subtitle}}</div>
            </a>
          </li>
        </sc-for>
      </ul>
    </sc-if>

    <sc-if value="{{noCharacters}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 96px 12px; text-align: center; border: 2px dashed #dde1e6; border-radius: 8px;">
        <div style="font-size: 14px; color: #1f2430; font-weight: 600;">No characters yet</div>
        <div style="font-size: 13px; color: #6b7280; line-height: 1.5;">Start one from scratch, or import a character you already have.</div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c1272d"},"$preview":{"width":1440,"height":640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      characters: [
        { id: 'k1', name: 'Elara Nightshade', level: 7, edition: 'one', race: 'High Elf', classSummary: 'Ranger', avatar: 'https://i.pravatar.cc/96?img=47', color: '#3f5d44' },
        { id: 'k2', name: 'Borin Ashfall', level: 5, edition: 'classic', race: 'Mountain Dwarf', classSummary: 'Fighter 3 / Wizard 2', avatar: 'https://i.pravatar.cc/96?img=13', color: '#7a3b2e' },
        { id: 'k3', name: 'Mira Sundown', level: 5, edition: 'one', race: 'Human', classSummary: 'Wizard', avatar: '', color: '#3a4f7a' },
        { id: 'k4', name: 'Vex Larimore', level: 4, edition: 'classic', race: 'Tiefling', classSummary: 'Warlock', avatar: 'https://i.pravatar.cc/96?img=32', color: '#7a3b53' }
      ]
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#c1272d';
    const { characters } = this.state;
    const rows = characters.map((c) => ({
      id: c.id,
      name: c.name,
      subtitle: c.race + ' ' + c.classSummary + ' • Lvl ' + c.level,
      edition: c.edition === 'one' ? '2024' : '2014',
      hasAvatar: !!c.avatar,
      noAvatar: !c.avatar,
      avatar: c.avatar,
      color: c.color,
      initial: c.name.charAt(0),
      open: () => {}
    }));
    return {
      accent,
      characters: rows,
      hasCharacters: characters.length > 0,
      noCharacters: characters.length === 0,
      countLabel: characters.length === 1 ? '1 character' : characters.length + ' characters',
      importCharacter: () => {}
    };
  }
}
</script>
</body>
</html>
