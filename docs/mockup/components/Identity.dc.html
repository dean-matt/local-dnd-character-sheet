<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Identity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  input, select { font-family: inherit; }
  input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }
</style>
</helmet>

<div style="width: 600px; height: 300px; box-sizing: border-box; padding: 32px; display: flex; align-items: center; background: #f4f5f7;">
  <div style="width: 100%; display: flex; flex-direction: column; gap: 16px;">
    <div style="background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; padding: 16px; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px;">
      <div>
        <label for="nameInput" style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 6px;">Name</label>
        <input id="nameInput" type="text" value="{{name}}" onChange="{{onName}}" style="width: 100%; padding: 8px 10px; border: 1px solid #dde1e6; border-radius: 8px; font-size: 14px; background: #ffffff; color: #1f2430;">
      </div>
      <div>
        <label for="raceInput" style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 6px;">Race</label>
        <input id="raceInput" type="text" value="{{race}}" onChange="{{onRace}}" style="width: 100%; padding: 8px 10px; border: 1px solid #dde1e6; border-radius: 8px; font-size: 14px; background: #ffffff; color: #1f2430;">
      </div>
      <div>
        <label for="classInput" style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 6px;">Class</label>
        <input id="classInput" type="text" value="{{cls}}" onChange="{{onCls}}" style="width: 100%; padding: 8px 10px; border: 1px solid #dde1e6; border-radius: 8px; font-size: 14px; background: #ffffff; color: #1f2430;">
      </div>
      <div>
        <label for="backgroundInput" style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 6px;">Background</label>
        <input id="backgroundInput" type="text" value="{{background}}" onChange="{{onBackground}}" style="width: 100%; padding: 8px 10px; border: 1px solid #dde1e6; border-radius: 8px; font-size: 14px; background: #ffffff; color: #1f2430;">
      </div>
    </div>

    <div style="background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; padding: 16px; display: grid; grid-template-columns: 100px 1fr 160px; gap: 16px; align-items: end;">
      <div>
        <label for="levelInput" style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 6px;">Level</label>
        <input id="levelInput" type="number" min="1" max="20" value="{{level}}" onChange="{{onLevel}}" style="width: 100%; padding: 8px 10px; border: 1px solid #dde1e6; border-radius: 8px; font-size: 14px; background: #ffffff; color: #1f2430;">
      </div>
      <div>
        <label for="alignmentSelect" style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 6px;">Alignment</label>
        <select id="alignmentSelect" value="{{alignment}}" onChange="{{onAlignment}}" style="width: 100%; padding: 8px 10px; border: 1px solid #dde1e6; border-radius: 8px; font-size: 14px; background: #ffffff; color: #1f2430;">
          <option value="Lawful Good">Lawful Good</option>
          <option value="Neutral Good">Neutral Good</option>
          <option value="Chaotic Good">Chaotic Good</option>
          <option value="Lawful Neutral">Lawful Neutral</option>
          <option value="True Neutral">True Neutral</option>
          <option value="Chaotic Neutral">Chaotic Neutral</option>
          <option value="Lawful Evil">Lawful Evil</option>
          <option value="Neutral Evil">Neutral Evil</option>
          <option value="Chaotic Evil">Chaotic Evil</option>
        </select>
      </div>
      <div>
        <label for="levelingModeSelect" style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 6px;">Leveling</label>
        <select id="levelingModeSelect" value="{{levelingMode}}" onChange="{{onLevelingMode}}" style="width: 100%; padding: 8px 10px; border: 1px solid #dde1e6; border-radius: 8px; font-size: 14px; background: #ffffff; color: #1f2430;">
          <option value="xp">Experience</option>
          <option value="milestone">Milestone</option>
        </select>
      </div>
      <sc-if value="{{isXpMode}}" hint-placeholder-val="{{true}}">
        <div style="grid-column: 1 / -1;">
          <label for="xpInput" style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 6px;">Experience Points</label>
          <input id="xpInput" type="number" min="0" value="{{xp}}" onChange="{{onXp}}" style="width: 200px; padding: 8px 10px; border: 1px solid #dde1e6; border-radius: 8px; font-size: 14px; background: #ffffff; color: #1f2430;">
        </div>
      </sc-if>
      <sc-if value="{{isMilestoneMode}}" hint-placeholder-val="{{false}}">
        <div style="grid-column: 1 / -1; font-size: 13px; font-style: italic; color: #6b7280;">Milestone leveling — the DM sets Level directly; no experience points tracked.</div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":300}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: 'Elara Nightshade', race: 'Half-Elf', cls: 'Ranger', background: 'Folk Hero', level: 7, alignment: 'Chaotic Good', levelingMode: 'xp', xp: 23000 };
  }
  renderVals() {
    const s = this.state;
    return {
      name: s.name, onName: (e) => this.setState({ name: e.target.value }),
      race: s.race, onRace: (e) => this.setState({ race: e.target.value }),
      cls: s.cls, onCls: (e) => this.setState({ cls: e.target.value }),
      background: s.background, onBackground: (e) => this.setState({ background: e.target.value }),
      level: s.level, onLevel: (e) => this.setState({ level: Math.max(1, Math.min(20, parseInt(e.target.value, 10) || 1)) }),
      alignment: s.alignment, onAlignment: (e) => this.setState({ alignment: e.target.value }),
      levelingMode: s.levelingMode, onLevelingMode: (e) => this.setState({ levelingMode: e.target.value }),
      isXpMode: s.levelingMode === 'xp',
      isMilestoneMode: s.levelingMode === 'milestone',
      xp: s.xp, onXp: (e) => this.setState({ xp: Math.max(0, parseInt(e.target.value, 10) || 0) })
    };
  }
}
</script>
</body>
</html>
