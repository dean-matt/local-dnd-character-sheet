<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Homebrew Content</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  textarea, input { font-family: inherit; }
  textarea::placeholder { color: #9aa1ab; }
</style>
</helmet>

<div style="width: 480px; height: 560px; box-sizing: border-box; padding: 24px; display: flex; align-items: center; background: #f4f5f7;">
  <div style="width: 100%; max-height: 512px; overflow-y: auto; background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; gap: 4px; border-bottom: 1px solid #dde1e6; padding-bottom: 2px;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button onClick="{{t.select}}" style="padding: 6px 10px; border: none; border-bottom: 2px solid {{t.borderColor}}; background: none; color: {{t.color}}; font-size: 12px; font-weight: 600; margin-bottom: -1px;">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #6b7280; text-transform: uppercase;">{{tabTitle}}</div>
      <button onClick="{{openAdd}}" style="padding: 6px 12px; border-radius: 6px; border: 1px solid {{accent}}; background: #fdf3ea; color: {{accent}}; font-size: 12px; font-weight: 600;">{{addLabel}}</button>
    </div>
    <sc-if value="{{noItems}}" hint-placeholder-val="{{false}}">
      <div style="font-size: 13px; color: #6b7280; font-style: italic;">{{emptyLabel}}</div>
    </sc-if>
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="1">
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: #eef0f3; border-radius: 6px; font-size: 14px; color: #1f2430; min-width: 0;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <button aria-label="Edit {{row.name}}" onClick="{{row.edit}}" style="all: unset; cursor: pointer; min-width: 20px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600;">{{row.name}}</button>
          <div style="flex-grow: 1;"></div>
          <button onClick="{{row.edit}}" style="padding: 4px 10px; border-radius: 999px; border: 1px solid #dde1e6; background: #ffffff; color: #1f2430; font-size: 11px; font-weight: 600; flex-shrink: 0;">Edit</button>
          <button aria-label="Delete {{row.name}}" onClick="{{row.remove}}" style="width: 20px; height: 20px; border: none; background: none; color: #6b7280; font-size: 16px; line-height: 1; padding: 0; flex-shrink: 0;">&times;</button>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 9px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #6b7280; background: #ffffff; border: 1px solid #dde1e6; border-radius: 4px; padding: 2px 5px;">{{row.chip1}}</span>
          <sc-if value="{{row.hasChip2}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 9px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #6b7280; background: #ffffff; border: 1px solid #dde1e6; border-radius: 4px; padding: 2px 5px;">{{row.chip2}}</span>
          </sc-if>
        </div>
        <div style="font-size: 11px; color: #6b7280; width: 100%; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{row.descShort}}</div>
      </div>
    </sc-for>
    <sc-if value="{{formOpen}}" hint-placeholder-val="{{false}}">
      <div style="border-top: 1px solid #dde1e6; padding-top: 10px; display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 12px; font-weight: 600; color: #1f2430;">{{formTitle}}</div>
        <div style="font-size: 11px; color: #6b7280;">Paste the entry's 5etools-shaped JSON. Saving replaces the whole entry; there's no field-by-field editing.</div>
        <label for="homebrewJson" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Entry JSON</label>
        <textarea id="homebrewJson" value="{{formJson}}" onChange="{{onFormJsonChange}}" placeholder="{{formPlaceholder}}" style="width: 100%; min-height: 90px; padding: 8px; border: 1px solid {{accent}}; border-radius: 6px; font-size: 12px; font-family: monospace; background: #ffffff; color: #1f2430; resize: vertical;"></textarea>
        <div style="display: flex; gap: 8px; justify-content: flex-end;">
          <button onClick="{{closeForm}}" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #dde1e6; background: none; color: #1f2430; font-size: 12px; font-weight: 600;">Cancel</button>
          <button onClick="{{saveForm}}" style="padding: 6px 12px; border-radius: 6px; border: none; background: {{accent}}; color: #ffffff; font-size: 12px; font-weight: 600;">Save</button>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c1272d"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: 'weapons',
      weapons: [
        { id: 'w1', name: 'Sunfire Blade', chip1: 'Martial', chip2: 'slashing', json: '{"name": "Sunfire Blade", "source": "HB", "type": "M", "weaponCategory": "martial", "dmgType": "S", "entries": ["A longsword that sheds light like a torch."]}' }
      ],
      armor: [
        { id: 'a1', name: 'Duskguard Plate', chip1: 'Heavy', json: '{"name": "Duskguard Plate", "source": "HB", "type": "HA", "entries": ["Blackened plate that dulls sound with every step."]}' }
      ],
      gear: [
        { id: 'g1', name: 'Ashfall Relic', chip1: 'Wondrous item', json: '{"name": "Ashfall Relic", "source": "HB", "type": "W", "entries": ["Warm to the touch; hums near dragons."]}' }
      ],
      spells: [
        { id: 's1', name: 'Coastal Ward', chip1: '2nd-level abjuration', json: '{"name": "Coastal Ward", "source": "HB", "level": 2, "school": "A", "entries": ["A wave of brine hardens into a temporary barrier."]}' }
      ],
      editingId: null,
      addOpen: false,
      formJson: ''
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#c1272d';
    const { tab, editingId, addOpen, formJson } = this.state;

    const TAB_META = {
      weapons: { label: 'Weapons', singular: 'weapon', placeholder: '{"name": "Sunfire Blade", "source": "HB", "type": "M", "weaponCategory": "martial", "dmgType": "S", "entries": ["..."]}' },
      armor: { label: 'Armor', singular: 'armor', placeholder: '{"name": "Duskguard Plate", "source": "HB", "type": "HA", "entries": ["..."]}' },
      gear: { label: 'Gear', singular: 'gear', placeholder: '{"name": "Ashfall Relic", "source": "HB", "type": "W", "entries": ["..."]}' },
      spells: { label: 'Spells', singular: 'spell', placeholder: '{"name": "Coastal Ward", "source": "HB", "level": 2, "school": "A", "entries": ["..."]}' }
    };
    const meta = TAB_META[tab];
    const list = this.state[tab];

    const descOf = (json) => {
      try {
        const parsed = JSON.parse(json);
        if (parsed && Array.isArray(parsed.entries) && parsed.entries.length) return String(parsed.entries[0]);
      } catch {}
      return '';
    };
    const deriveChips = (json) => {
      let chip1 = 'Homebrew', chip2 = null;
      try {
        const parsed = JSON.parse(json);
        if (tab === 'weapons') {
          chip1 = parsed.weaponCategory === 'simple' ? 'Simple' : 'Martial';
          const dmgMap = { S: 'slashing', P: 'piercing', B: 'bludgeoning' };
          chip2 = dmgMap[parsed.dmgType] || 'slashing';
        } else if (tab === 'armor') {
          const typeMap = { LA: 'Light', MA: 'Medium', HA: 'Heavy', S: 'Shield' };
          chip1 = typeMap[parsed.type] || 'Light';
        } else if (tab === 'gear') {
          const typeMap = { W: 'Wondrous item', P: 'Consumable', GS: 'Pack' };
          chip1 = typeMap[parsed.type] || 'Adventuring';
        } else if (tab === 'spells') {
          const ord = parsed.level === 0 ? 'Cantrip' : parsed.level + (parsed.level === 1 ? 'st' : parsed.level === 2 ? 'nd' : parsed.level === 3 ? 'rd' : 'th') + '-level';
          const schoolMap = { A: 'abjuration', C: 'conjuration', D: 'divination', E: 'enchantment', V: 'evocation', I: 'illusion', N: 'necromancy', T: 'transmutation' };
          chip1 = ord + ' ' + (schoolMap[parsed.school] || 'spell');
        }
      } catch {}
      return { chip1, chip2 };
    };

    const rows = list.map((it) => ({
      id: it.id,
      name: it.name,
      chip1: it.chip1,
      chip2: it.chip2,
      hasChip2: !!it.chip2,
      descShort: descOf(it.json),
      edit: () => this.setState({ editingId: it.id, addOpen: false, formJson: it.json }),
      remove: () => this.setState({ [tab]: list.filter((x) => x.id !== it.id), editingId: editingId === it.id ? null : editingId })
    }));
    const editing = list.find((it) => it.id === editingId);

    const tabs = Object.keys(TAB_META).map((key) => ({
      key,
      label: TAB_META[key].label,
      color: key === tab ? accent : '#6b7280',
      borderColor: key === tab ? accent : 'transparent',
      select: () => this.setState({ tab: key, editingId: null, addOpen: false, formJson: '' })
    }));

    return {
      accent,
      tabs,
      tabTitle: meta.label,
      addLabel: '+ Add ' + meta.label.slice(0, -1),
      rows,
      noItems: list.length === 0,
      emptyLabel: 'No homebrew ' + meta.label.toLowerCase() + ' yet.',
      formOpen: addOpen || !!editing,
      formTitle: editing ? 'Edit ' + editing.name : 'New homebrew ' + meta.singular,
      formPlaceholder: meta.placeholder,
      formJson,
      onFormJsonChange: (e) => this.setState({ formJson: e.target.value }),
      openAdd: () => this.setState({ addOpen: true, editingId: null, formJson: '' }),
      closeForm: () => this.setState({ addOpen: false, editingId: null, formJson: '' }),
      saveForm: () => {
        let parsedName = 'Untitled ' + meta.singular[0].toUpperCase() + meta.singular.slice(1);
        try {
          const parsed = JSON.parse(formJson);
          if (parsed && parsed.name) parsedName = parsed.name;
        } catch {}
        const { chip1, chip2 } = deriveChips(formJson);
        if (editing) {
          this.setState({ [tab]: list.map((x) => (x.id === editing.id ? { ...x, name: parsedName, chip1, chip2, json: formJson } : x)), editingId: null, formJson: '' });
        } else {
          this.setState({ [tab]: [...list, { id: tab[0] + Date.now(), name: parsedName, chip1, chip2, json: formJson }], addOpen: false, formJson: '' });
        }
      }
    };
  }
}
</script>
</body>
</html>
