<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Settings Panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }
</style>
</helmet>

<div style="width: 520px; height: 560px; box-sizing: border-box; padding: 32px; display: flex; align-items: center; justify-content: center; background: #f4f5f7;">
  <div style="width: 440px; max-height: 496px; overflow-y: auto; background: #ffffff; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 24px 48px rgba(0, 0, 0, 0.18);">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 17px; font-weight: 700; color: #1f2430;">Settings</div>
      <button aria-label="Close settings" style="width: 28px; height: 28px; border: none; background: none; color: #6b7280; font-size: 18px; line-height: 1;">&times;</button>
    </div>

    <div>
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #6b7280; text-transform: uppercase; margin-bottom: 10px;">Display</div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
        <span style="font-size: 14px; color: #1f2430;">Dark mode</span>
        <button aria-label="{{darkModeLabel}}" onClick="{{toggleDarkMode}}" style="width: 42px; height: 24px; border-radius: 999px; border: 1px solid #dde1e6; background: {{darkTrackBg}}; position: relative; padding: 0;">
          <span style="position: absolute; top: 2px; left: {{darkThumbLeft}}; width: 18px; height: 18px; border-radius: 50%; background: #ffffff; transition: left 0.15s;"></span>
        </button>
      </div>
      <div style="font-size: 13px; color: #1f2430; margin-bottom: 8px;">Accent color</div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <sc-for list="{{accentPresets}}" as="ap" hint-placeholder-count="5">
          <button aria-label="{{ap.name}} accent" title="{{ap.name}}" onClick="{{ap.select}}" style="width: 26px; height: 26px; border-radius: 50%; background: {{ap.color}}; border: 2px solid {{ap.ring}}; padding: 0;"></button>
        </sc-for>
        <label for="customAccentInput" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Custom accent color</label>
        <input id="customAccentInput" type="color" value="{{accent}}" onChange="{{onCustomAccent}}" title="Custom color" style="width: 26px; height: 26px; border: 1px solid #dde1e6; border-radius: 50%; padding: 0; background: none;">
      </div>
    </div>

    <div>
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #6b7280; text-transform: uppercase; margin-bottom: 10px;">Homebrew Content</div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <sc-for list="{{homebrewRows}}" as="hb" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #eef0f3; border-radius: 8px;">
            <span style="font-size: 13px; color: #1f2430;">{{hb.name}}</span>
            <button aria-label="Toggle {{hb.name}}" onClick="{{hb.toggle}}" style="width: 36px; height: 20px; border-radius: 999px; border: 1px solid #dde1e6; background: {{hb.trackBg}}; position: relative; padding: 0; flex-shrink: 0;">
              <span style="position: absolute; top: 1px; left: {{hb.thumbLeft}}; width: 16px; height: 16px; border-radius: 50%; background: #ffffff; transition: left 0.15s;"></span>
            </button>
          </div>
        </sc-for>
      </div>
    </div>

    <div>
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #6b7280; text-transform: uppercase; margin-bottom: 10px;">Imported Content</div>
      <div style="padding: 12px 14px; background: #eef0f3; border-radius: 8px; font-size: 13px; color: #1f2430; line-height: 1.6;">
        Source: 5etools (synced content, pinned tag)<br>
        <span style="color: #6b7280;">Read-only — rebuilt wholesale from the upstream data, never hand-edited.</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":560}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      isDark: false,
      accent: '#d9730d',
      homebrewPacks: [
        { id: 'hb1', name: 'Homebrew Feats Pack', enabled: true },
        { id: 'hb2', name: 'Homebrew Spells: Coastal Traditions', enabled: true },
        { id: 'hb3', name: 'Homebrew Items: Ashfall Relics', enabled: false }
      ]
    };
  }
  renderVals() {
    const accent = this.state.accent;
    const isDark = this.state.isDark;
    const PRESETS = [
      { name: 'Orange', color: '#d9730d' },
      { name: 'Red', color: '#c1272d' },
      { name: 'Green', color: '#3f5d44' },
      { name: 'Blue', color: '#3a4f7a' },
      { name: 'Plum', color: '#7a3b53' }
    ];
    const accentPresets = PRESETS.map((p) => ({ name: p.name, color: p.color, ring: accent === p.color ? p.color : '#dde1e6', select: () => this.setState({ accent: p.color }) }));
    const homebrewPacks = this.state.homebrewPacks;
    const homebrewRows = homebrewPacks.map((hb) => ({
      id: hb.id,
      name: hb.name,
      trackBg: hb.enabled ? accent : '#dde1e6',
      thumbLeft: hb.enabled ? '18px' : '1px',
      toggle: () => this.setState({ homebrewPacks: homebrewPacks.map((x) => (x.id === hb.id ? { ...x, enabled: !x.enabled } : x)) })
    }));
    return {
      accent,
      darkModeLabel: isDark ? 'Switch to light mode' : 'Switch to dark mode',
      toggleDarkMode: () => this.setState({ isDark: !isDark }),
      darkTrackBg: isDark ? accent : '#dde1e6',
      darkThumbLeft: isDark ? '20px' : '2px',
      accentPresets,
      onCustomAccent: (e) => this.setState({ accent: e.target.value }),
      homebrewRows
    };
  }
}
</script>
</body>
</html>
