<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Notes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  textarea, input { font-family: inherit; }
  textarea::placeholder { color: #9aa1ab; }
</style>
</helmet>

<div style="width: 480px; height: 420px; box-sizing: border-box; padding: 32px; display: flex; align-items: center; background: #f4f5f7;">
  <div style="width: 100%; max-height: 356px; overflow-y: auto;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #6b7280; text-transform: uppercase;">Notes</div>
      <button onClick="{{addSection}}" style="padding: 6px 12px; border-radius: 6px; border: 1px solid {{accent}}; background: none; color: {{accent}}; font-size: 12px; font-weight: 600;">+ Add Section</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <sc-for list="{{sections}}" as="sec" hint-placeholder-count="1">
        <div style="border: 1px solid #dde1e6; border-radius: 10px; padding: 14px; background: #ffffff; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <label for="secTitle-{{sec.id}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Section title</label>
            <input id="secTitle-{{sec.id}}" type="text" value="{{sec.title}}" onChange="{{sec.onTitle}}" style="flex-grow: 1; font-size: 15px; font-weight: 600; border: none; background: none; padding: 4px 0; color: #1f2430;">
            <button aria-label="Remove section {{sec.title}}" onClick="{{sec.remove}}" style="width: 22px; height: 22px; border: none; background: none; color: #6b7280; font-size: 16px; line-height: 1;">&times;</button>
          </div>
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <sc-for list="{{sec.notes}}" as="note" hint-placeholder-count="1">
              <div style="border: 1px solid #dde1e6; border-radius: 8px; padding: 10px; background: #eef0f3; display: flex; flex-direction: column; gap: 8px;">
                <label for="noteText-{{note.id}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Note text</label>
                <textarea id="noteText-{{note.id}}" value="{{note.text}}" onChange="{{note.onText}}" placeholder="Write a note…" style="width: 100%; min-height: 60px; border: 1px solid #dde1e6; border-radius: 6px; padding: 8px; font-size: 13px; background: #ffffff; color: #1f2430; resize: vertical;"></textarea>
                <div style="display: flex; justify-content: flex-end;">
                  <button aria-label="Remove note" onClick="{{note.remove}}" style="border: none; background: none; color: #6b7280; font-size: 12px;">Remove</button>
                </div>
              </div>
            </sc-for>
          </div>
          <button onClick="{{sec.addNote}}" style="align-self: flex-start; padding: 6px 12px; border-radius: 6px; border: 1px dashed #dde1e6; background: none; color: #6b7280; font-size: 12px;">+ Add note</button>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c1272d"},"$preview":{"width":480,"height":420}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      sections: [
        { id: 'log', title: 'Campaign Log', notes: [{ id: 'n1', text: 'Tracking a cult of fiend-worshippers through the Thornwood. Owes a favor to the Ashfall druids.' }] }
      ]
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#c1272d';
    const sections = this.state.sections;
    const setSections = (updater) => this.setState({ sections: updater(sections) });
    const sectionRows = sections.map((sec) => ({
      id: sec.id,
      title: sec.title,
      onTitle: (e) => setSections((secs) => secs.map((s) => (s.id === sec.id ? { ...s, title: e.target.value } : s))),
      remove: () => setSections((secs) => secs.filter((s) => s.id !== sec.id)),
      addNote: () => setSections((secs) => secs.map((s) => (s.id === sec.id ? { ...s, notes: [...s.notes, { id: 'note-' + Date.now(), text: '' }] } : s))),
      notes: sec.notes.map((note) => ({
        id: note.id,
        text: note.text,
        onText: (e) => setSections((secs) => secs.map((s) => (s.id === sec.id ? { ...s, notes: s.notes.map((n) => (n.id === note.id ? { ...n, text: e.target.value } : n)) } : s))),
        remove: () => setSections((secs) => secs.map((s) => (s.id === sec.id ? { ...s, notes: s.notes.filter((n) => n.id !== note.id) } : s)))
      }))
    }));
    return {
      accent,
      sections: sectionRows,
      addSection: () => this.setState({ sections: [...sections, { id: 'sec-' + Date.now(), title: 'New Section', notes: [] }] })
    };
  }
}
</script>
</body>
</html>
