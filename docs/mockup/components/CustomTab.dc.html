<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Custom Tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
</style>
</helmet>

<div style="width: 1200px; height: 860px; box-sizing: border-box; padding: 32px; display: flex; align-items: center; background: #f4f5f7; position: relative;">
  <div style="width: 100%; height: 100%; background: #ffffff; border: 1px solid #dde1e6; border-radius: 8px; padding: 24px 40px; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 20px; font-weight: 700; color: #1f2430;">My Custom Tab</div>
      <button onClick="{{toggleEditing}}" style="padding: 7px 16px; border-radius: 6px; border: 1px solid {{editButtonBorder}}; background: {{editButtonBg}}; color: {{editButtonColor}}; font-size: 13px; font-weight: 600;">{{editButtonLabel}}</button>
    </div>

    <sc-if value="{{noWidgets}}" hint-placeholder-val="{{false}}">
      <div style="font-size: 13px; color: #6b7280; font-style: italic; padding: 24px 0; text-align: center;">No widgets on this tab yet.</div>
    </sc-if>

    <div style="flex-grow: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); grid-auto-rows: 140px; gap: 16px; align-content: start;">
      <sc-for list="{{widgets}}" as="w" hint-placeholder-count="3">
        <div draggable="{{editing}}" onDragStart="{{w.onDragStart}}" onDragOver="{{w.onDragOver}}" onDrop="{{w.onDrop}}" style="grid-column: span {{w.colSpan}}; grid-row: span {{w.rowSpan}}; position: relative; background: #ffffff; border: 1px {{w.borderStyle}} {{w.borderColor}}; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; cursor: {{w.moveCursor}};">
          <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #6b7280; text-transform: uppercase; padding-right: 20px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">{{w.title}}</div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; justify-content: center;">
            <div style="height: 10px; border-radius: 4px; background: #eef0f3; width: 88%;"></div>
            <div style="height: 10px; border-radius: 4px; background: #eef0f3; width: 65%;"></div>
            <sc-if value="{{w.tall}}" hint-placeholder-val="{{false}}">
              <div style="height: 10px; border-radius: 4px; background: #eef0f3; width: 76%;"></div>
              <div style="height: 10px; border-radius: 4px; background: #eef0f3; width: 45%;"></div>
            </sc-if>
          </div>
          <sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
            <span title="Drag to move" style="position: absolute; top: 10px; left: 10px; color: #9aa1ab; display: flex;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.4"/><circle cx="8" cy="12" r="1.4"/><circle cx="8" cy="18" r="1.4"/><circle cx="16" cy="6" r="1.4"/><circle cx="16" cy="12" r="1.4"/><circle cx="16" cy="18" r="1.4"/></svg>
            </span>
            <button aria-label="Remove {{w.title}}" onClick="{{w.remove}}" style="position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border: none; background: none; color: #6b7280; font-size: 16px; line-height: 1; padding: 0;">&times;</button>
            <span draggable="true" onDragStart="{{w.onResizeDragStart}}" onDragOver="{{w.onResizeDragOver}}" onDrop="{{w.onResizeDrop}}" title="Drag to resize ({{w.sizeLabel}})" style="position: absolute; bottom: 8px; right: 8px; width: 16px; height: 16px; color: #9aa1ab; cursor: nwse-resize; display: flex; align-items: center; justify-content: center;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v6h-6M21 21L13 13"/><path d="M9 3H3v6"/><path d="M3 3l8 8"/></svg>
            </span>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
      <button onClick="{{openPicker}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px; border-radius: 8px; border: 1px dashed {{accent}}; background: none; color: {{accent}}; font-size: 13px; font-weight: 600; flex-shrink: 0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Add Widget
      </button>
    </sc-if>
  </div>

  <sc-if value="{{pickerOpen}}" hint-placeholder-val="{{false}}">
    <div role="presentation" onClick="{{closePicker}}" style="position: fixed; inset: 0; background: rgba(15,17,21,0.5); display: flex; align-items: center; justify-content: center; z-index: 50;">
      <div onClick="{{stopPropagation}}">
        <dc-import name="WidgetPicker" added="{{addedIds}}" on-change="{{onPickerChange}}" on-close="{{closePicker}}" accent="{{accent}}" hint-size="560px,600px"></dc-import>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c1272d"},"$preview":{"width":1200,"height":860}}'>
const SIZE_PRESETS = [
  { colSpan: 1, rowSpan: 1, label: 'S' },
  { colSpan: 2, rowSpan: 1, label: 'M' },
  { colSpan: 2, rowSpan: 2, label: 'L' },
  { colSpan: 3, rowSpan: 2, label: 'XL' }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      editing: false,
      pickerOpen: false,
      dragWidgetId: null,
      resizeWidgetId: null,
      widgets: [
        { id: 'weapons', title: 'Weapons', sizeIndex: 2 },
        { id: 'notes', title: 'Notes', sizeIndex: 1 },
        { id: 'level', title: 'Level & Experience', sizeIndex: 0 }
      ]
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#c1272d';
    const { editing, pickerOpen, dragWidgetId, resizeWidgetId, widgets } = this.state;

    const reorder = (dragId, dropId) => {
      const i1 = widgets.findIndex((w) => w.id === dragId);
      const i2 = widgets.findIndex((w) => w.id === dropId);
      if (i1 === -1 || i2 === -1 || i1 === i2) return;
      const next = widgets.slice();
      const [moved] = next.splice(i1, 1);
      next.splice(i2, 0, moved);
      this.setState({ widgets: next, dragWidgetId: null });
    };

    const cycleSize = (id) => {
      this.setState({
        widgets: widgets.map((w) => (w.id === id ? { ...w, sizeIndex: (w.sizeIndex + 1) % SIZE_PRESETS.length } : w)),
        resizeWidgetId: null
      });
    };

    const widgetRows = widgets.map((w) => {
      const preset = SIZE_PRESETS[w.sizeIndex] || SIZE_PRESETS[0];
      return {
        id: w.id,
        title: w.title,
        colSpan: preset.colSpan,
        rowSpan: preset.rowSpan,
        tall: preset.rowSpan > 1,
        sizeLabel: preset.label,
        borderStyle: editing ? 'dashed' : 'solid',
        borderColor: editing ? (dragWidgetId && dragWidgetId !== w.id ? accent : '#c7cbd1') : '#dde1e6',
        moveCursor: editing ? 'grab' : 'default',
        remove: () => this.setState({ widgets: widgets.filter((x) => x.id !== w.id) }),
        onDragStart: () => editing && this.setState({ dragWidgetId: w.id }),
        onDragOver: (e) => editing && e.preventDefault(),
        onDrop: (e) => {
          if (!editing) return;
          e.preventDefault();
          if (dragWidgetId) reorder(dragWidgetId, w.id);
        },
        onResizeDragStart: (e) => {
          e.stopPropagation();
          this.setState({ resizeWidgetId: w.id });
        },
        onResizeDragOver: (e) => e.preventDefault(),
        onResizeDrop: (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (resizeWidgetId) cycleSize(resizeWidgetId);
        }
      };
    });

    const addedIds = widgets.map((w) => w.id);

    return {
      accent,
      editing,
      editButtonLabel: editing ? 'Done' : 'Edit',
      editButtonBorder: editing ? accent : '#dde1e6',
      editButtonBg: editing ? '#fdf3ea' : '#ffffff',
      editButtonColor: editing ? accent : '#1f2430',
      toggleEditing: () => this.setState({ editing: !editing }),
      widgets: widgetRows,
      noWidgets: widgets.length === 0,
      pickerOpen,
      addedIds,
      openPicker: () => this.setState({ pickerOpen: true }),
      closePicker: () => this.setState({ pickerOpen: false }),
      onPickerChange: (nextIds, d) => {
        const wasAdded = addedIds.indexOf(d.id) === -1 && nextIds.indexOf(d.id) !== -1;
        if (wasAdded) {
          this.setState({ widgets: [...widgets, { id: d.id, title: d.title, sizeIndex: 0 }] });
        } else {
          this.setState({ widgets: widgets.filter((w) => w.id !== d.id) });
        }
      },
      stopPropagation: (e) => e.stopPropagation()
    };
  }
}
</script>
</body>
</html>
