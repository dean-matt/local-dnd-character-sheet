<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Spell Slots</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
</style>
</helmet>

<div style="width: 260px; height: 260px; box-sizing: border-box; padding: 32px; display: flex; align-items: center; background: #f4f5f7; position: relative;">
  <div style="width: 100%; background: #ffffff; border: 1px solid #dde1e6; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #6b7280; text-transform: uppercase;">Spell Slots</div>
    <sc-for list="{{slotRows}}" as="lvl" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 6px;">
        <button aria-label="View {{lvl.label}} slot details" onClick="{{lvl.openDetail}}" style="all: unset; cursor: pointer; font-size: 12px; color: #1f2430; width: 48px; flex-shrink: 0;">{{lvl.label}}</button>
        <div style="display: flex; gap: 3px; flex-wrap: wrap; flex-grow: 1;">
          <sc-for list="{{lvl.pips}}" as="pip" hint-placeholder-count="3">
            <button aria-label="{{pip.aria}}" title="{{pip.title}}" onClick="{{pip.toggle}}" style="width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid {{accent}}; background: {{pip.fill}}; padding: 0; flex-shrink: 0;"></button>
          </sc-for>
        </div>
        <button aria-label="Add a {{lvl.label}} slot" onClick="{{lvl.addSlot}}" style="width: 15px; height: 15px; border: none; background: none; color: #6b7280; font-size: 13px; line-height: 1; padding: 0; flex-shrink: 0;">+</button>
        <button aria-label="Remove a {{lvl.label}} slot" onClick="{{lvl.removeSlot}}" style="width: 15px; height: 15px; border: none; background: none; color: #6b7280; font-size: 13px; line-height: 1; padding: 0; flex-shrink: 0;">&minus;</button>
      </div>
    </sc-for>
    <button onClick="{{resetSlots}}" style="align-self: flex-start; font-size: 11px; font-weight: 600; color: {{accent}}; border: none; background: none; padding: 0; margin-top: 4px;">Reset (long rest)</button>
  </div>
  <sc-if value="{{modalOpen}}" hint-placeholder-val="{{false}}">
    <div role="presentation" onClick="{{closeModal}}" style="position: fixed; inset: 0; background: rgba(15,17,21,0.5); display: flex; align-items: center; justify-content: center; z-index: 50;">
      <div role="dialog" aria-modal="true" aria-label="{{modalTitle}}" onClick="{{stopPropagation}}" style="background: #ffffff; border-radius: 10px; padding: 20px; width: min(320px, 85%); max-height: 80%; overflow: auto; box-shadow: 0 12px 32px rgba(0,0,0,0.3);">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px;">
          <div style="font-size: 15px; font-weight: 700;">{{modalTitle}}</div>
          <button aria-label="Close" onClick="{{closeModal}}" style="border: none; background: none; font-size: 18px; line-height: 1; cursor: pointer; color: #6b7280;">&times;</button>
        </div>
        <div style="font-size: 22px; font-weight: 700; color: {{accent}}; margin-bottom: 10px;">{{modalAvailable}} of {{modalTotal}} available</div>
        <div style="font-size: 13px; color: #1f2430; line-height: 1.5;">Spend a slot to cast a spell of this level or higher. Expended slots return on a long rest.</div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c1272d"},"$preview":{"width":260,"height":260}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { slots: { '1': { total: 4, used: 2 }, '2': { total: 3, used: 1 }, '3': { total: 2, used: 0 } }, modalItem: null };
  }
  renderVals() {
    const accent = this.props.accent ?? '#c1272d';
    const levelLabel = (n) => (n === 0 ? 'Cantrips' : n === 1 ? '1st Level' : n === 2 ? '2nd Level' : n === 3 ? '3rd Level' : n + 'th Level');
    const slots = this.state.slots;
    const setLevel = (lvlKey, updater) => this.setState({ slots: { ...slots, [lvlKey]: updater(slots[lvlKey]) } });
    const slotRows = Object.keys(slots)
      .sort((a, b) => parseInt(a, 10) - parseInt(b, 10))
      .map((lvlKey) => {
        const slot = slots[lvlKey];
        const label = levelLabel(parseInt(lvlKey, 10));
        const pips = [];
        for (let i = 0; i < slot.total; i++) {
          const filled = i < slot.used;
          pips.push({
            fill: filled ? accent : 'transparent',
            aria: (filled ? 'Restore' : 'Expend') + ' ' + label + ' slot ' + (i + 1),
            title: filled ? 'Click to restore this slot' : 'Click to mark expended',
            toggle: () => setLevel(lvlKey, (s) => ({ ...s, used: i + 1 === s.used ? i : i + 1 }))
          });
        }
        return {
          key: lvlKey,
          label,
          available: slot.total - slot.used,
          total: slot.total,
          pips,
          addSlot: () => setLevel(lvlKey, (s) => ({ ...s, total: Math.min(9, s.total + 1) })),
          removeSlot: () => setLevel(lvlKey, (s) => ({ total: Math.max(0, s.total - 1), used: Math.min(s.used, Math.max(0, s.total - 1)) })),
          openDetail: () => this.setState({ modalItem: { label, available: slot.total - slot.used, total: slot.total } })
        };
      });
    const modalItem = this.state.modalItem;
    return {
      accent,
      slotRows,
      resetSlots: () => {
        const next = {};
        Object.keys(slots).forEach((k) => { next[k] = { ...slots[k], used: 0 }; });
        this.setState({ slots: next });
      },
      modalOpen: !!modalItem,
      modalTitle: modalItem ? modalItem.label + ' Slots' : '',
      modalAvailable: modalItem ? modalItem.available : '',
      modalTotal: modalItem ? modalItem.total : '',
      closeModal: () => this.setState({ modalItem: null }),
      stopPropagation: (e) => e.stopPropagation()
    };
  }
}
</script>
</body>
</html>
