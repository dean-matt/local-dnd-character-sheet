<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Homebrew Items</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  textarea, input { font-family: inherit; }
  textarea::placeholder { color: #9aa1ab; }
</style>
</helmet>

<div style="width: 460px; height: 420px; box-sizing: border-box; padding: 24px; display: flex; align-items: center; background: #f4f5f7;">
  <div style="width: 100%; max-height: 372px; overflow-y: auto; background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #6b7280; text-transform: uppercase;">Homebrew Items</div>
      <button onClick="{{openAdd}}" style="padding: 6px 12px; border-radius: 6px; border: 1px solid {{accent}}; background: #fdf3ea; color: {{accent}}; font-size: 12px; font-weight: 600;">+ Add Item</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <sc-if value="{{noItems}}" hint-placeholder-val="{{false}}">
        <div style="font-size: 13px; color: #6b7280; font-style: italic;">No homebrew items yet.</div>
      </sc-if>
      <sc-for list="{{items}}" as="item" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #eef0f3; border-radius: 8px;">
          <div style="flex-grow: 1; min-width: 0;">
            <div style="font-size: 14px; color: #1f2430; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{item.name}}</div>
            <div style="font-size: 11px; color: #6b7280;">{{item.category}}</div>
          </div>
          <button onClick="{{item.edit}}" style="padding: 4px 10px; border-radius: 999px; border: 1px solid #dde1e6; background: #ffffff; color: #1f2430; font-size: 11px; font-weight: 600; flex-shrink: 0;">Edit</button>
          <button aria-label="Delete {{item.name}}" onClick="{{item.remove}}" style="width: 22px; height: 22px; border: none; background: none; color: #6b7280; font-size: 16px; line-height: 1; padding: 0; flex-shrink: 0;">&times;</button>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{formOpen}}" hint-placeholder-val="{{false}}">
      <div style="border-top: 1px solid #dde1e6; padding-top: 12px; display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 12px; font-weight: 600; color: #1f2430;">{{formTitle}}</div>
        <div style="font-size: 11px; color: #6b7280;">Paste the item's 5etools-shaped entry — name, source, entries, and so on. Saving replaces the whole entry; there's no field-by-field editing.</div>
        <label for="itemJson" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Item JSON</label>
        <textarea id="itemJson" value="{{formJson}}" onChange="{{onFormJsonChange}}" placeholder='{"name": "Sunfire Blade", "source": "HB", "type": "M", "entries": ["A longsword that sheds light like a torch."]}' style="width: 100%; min-height: 100px; padding: 8px; border: 1px solid {{accent}}; border-radius: 6px; font-size: 12px; font-family: monospace; background: #ffffff; color: #1f2430; resize: vertical;"></textarea>
        <div style="display: flex; gap: 8px; justify-content: flex-end;">
          <button onClick="{{closeForm}}" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #dde1e6; background: none; color: #1f2430; font-size: 12px; font-weight: 600;">Cancel</button>
          <button onClick="{{saveForm}}" style="padding: 6px 12px; border-radius: 6px; border: none; background: {{accent}}; color: #ffffff; font-size: 12px; font-weight: 600;">Save</button>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c1272d"},"$preview":{"width":460,"height":420}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      items: [
        { id: 'i1', name: 'Sunfire Blade', category: 'Weapon (longsword)', json: '{"name": "Sunfire Blade", "source": "HB", "type": "M", "entries": ["A longsword that sheds light like a torch."]}' },
        { id: 'i2', name: "Ashfall Relic", category: 'Wondrous item', json: '{"name": "Ashfall Relic", "source": "HB", "type": "W", "entries": ["Warm to the touch; hums near dragons."]}' }
      ],
      editingId: null,
      addOpen: false,
      formJson: ''
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#c1272d';
    const { items, editingId, addOpen, formJson } = this.state;
    const itemRows = items.map((it) => ({
      id: it.id,
      name: it.name,
      category: it.category,
      edit: () => this.setState({ editingId: it.id, addOpen: false, formJson: it.json }),
      remove: () => this.setState({ items: items.filter((x) => x.id !== it.id), editingId: editingId === it.id ? null : editingId })
    }));
    const editing = items.find((it) => it.id === editingId);
    return {
      accent,
      items: itemRows,
      noItems: items.length === 0,
      formOpen: addOpen || !!editing,
      formTitle: editing ? 'Edit ' + editing.name : 'New homebrew item',
      formJson,
      onFormJsonChange: (e) => this.setState({ formJson: e.target.value }),
      openAdd: () => this.setState({ addOpen: true, editingId: null, formJson: '' }),
      closeForm: () => this.setState({ addOpen: false, editingId: null, formJson: '' }),
      saveForm: () => {
        let parsedName = 'Untitled Item';
        try {
          const parsed = JSON.parse(formJson);
          if (parsed && parsed.name) parsedName = parsed.name;
        } catch {}
        if (editing) {
          this.setState({ items: items.map((x) => (x.id === editing.id ? { ...x, name: parsedName, json: formJson } : x)), editingId: null, formJson: '' });
        } else {
          this.setState({ items: [...items, { id: 'i' + Date.now(), name: parsedName, category: 'Homebrew item', json: formJson }], addOpen: false, formJson: '' });
        }
      }
    };
  }
}
</script>
</body>
</html>
