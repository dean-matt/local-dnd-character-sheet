<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filter — Features</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  label, select { font-family: inherit; }
</style>
</helmet>

<div style="width: 220px; background: #ffffff; border: 1px solid #dde1e6; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 12px 24px rgba(0,0,0,0.18);">
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6b7280;">Filter Features</div>
    <button aria-label="Close filter" onClick="{{close}}" style="border: none; background: none; font-size: 16px; line-height: 1; color: #6b7280; padding: 0;">&times;</button>
  </div>

  <div>
    <div style="font-size: 11px; font-weight: 600; color: #6b7280; margin-bottom: 6px;">Source</div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px;">
      <sc-for list="{{sourceChips}}" as="chip" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 4px 3px 10px; border-radius: 999px; background: #eceef1; border: 1px solid #dde1e6; color: #1f2430;">
          {{chip.label}}
          <button aria-label="Remove {{chip.label}}" onClick="{{chip.remove}}" style="width: 14px; height: 14px; border: none; background: none; color: #6b7280; font-size: 12px; line-height: 1; padding: 0;">&times;</button>
        </div>
      </sc-for>
      <sc-if value="{{sourceEmpty}}" hint-placeholder-val="{{true}}">
        <div style="font-size: 12px; color: #9aa1ab; font-style: italic;">Showing all</div>
      </sc-if>
    </div>
    <sc-if value="{{sourceHasHidden}}" hint-placeholder-val="{{true}}">
      <select onChange="{{onSourceAdd}}" value="" aria-label="Narrow by source" style="width: 100%; padding: 6px 8px; border: 1px solid #dde1e6; border-radius: 6px; font-size: 12px; background: #ffffff; color: #1f2430;">
        <option value="" disabled>+ Narrow to source…</option>
        <sc-for list="{{sourceHiddenOptions}}" as="opt" hint-placeholder-count="1">
          <option value="{{opt.value}}">{{opt.label}}</option>
        </sc-for>
      </select>
    </sc-if>
  </div>

  <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #1f2430; border-top: 1px solid #dde1e6; padding-top: 8px;">
    <input type="checkbox" checked="{{hasUsesOnly}}" onChange="{{toggleHasUsesOnly}}"> Has limited uses only
  </label>
  <button onClick="{{reset}}" style="align-self: flex-start; border: none; background: none; font-size: 12px; font-weight: 600; color: {{accent}}; padding: 0;">Reset</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"filters":{"editor":null},"onChange":{"editor":null},"onClose":{"editor":null},"accent":{"editor":"color","default":"#c1272d"},"$preview":{"width":220,"height":250}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#c1272d';
    const DEFAULT = { sources: [], hasUsesOnly: false };
    const filters = this.props.filters || DEFAULT;
    const onChange = this.props.onChange || (() => {});
    const onClose = this.props.onClose || (() => {});
    const set = (next) => onChange({ ...filters, ...next });
    const SOURCE_LABEL = { class: 'Class', race: 'Race', chosen: 'Chosen & Feats' };
    const makeFacet = (selected, allKeys, apply, labelFn) => {
      const label = labelFn || ((k) => k);
      const hidden = allKeys.filter((k) => selected.indexOf(k) === -1);
      return {
        chips: selected.map((k) => ({ label: label(k), remove: () => apply(selected.filter((x) => x !== k)) })),
        isEmpty: selected.length === 0,
        hasHidden: hidden.length > 0,
        hiddenOptions: hidden.map((k) => ({ value: k, label: label(k) })),
        onAdd: (e) => { const k = e.target.value; if (k) apply([...selected, k]); }
      };
    };
    const sourceFacet = makeFacet(filters.sources, ['class', 'race', 'chosen'], (next) => set({ sources: next }), (k) => SOURCE_LABEL[k]);
    return {
      accent,
      sourceChips: sourceFacet.chips,
      sourceEmpty: sourceFacet.isEmpty,
      sourceHasHidden: sourceFacet.hasHidden,
      sourceHiddenOptions: sourceFacet.hiddenOptions,
      onSourceAdd: sourceFacet.onAdd,
      hasUsesOnly: filters.hasUsesOnly,
      toggleHasUsesOnly: () => set({ hasUsesOnly: !filters.hasUsesOnly }),
      reset: () => onChange(DEFAULT),
      close: () => onClose()
    };
  }
}
</script>
</body>
</html>
