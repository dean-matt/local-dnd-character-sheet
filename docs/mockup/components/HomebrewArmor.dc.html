<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Homebrew Armor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  textarea, input { font-family: inherit; }
  textarea::placeholder { color: #9aa1ab; }
</style>
</helmet>

<div style="width: 480px; height: 440px; box-sizing: border-box; padding: 24px; display: flex; align-items: center; background: #f4f5f7;">
  <div style="width: 100%; max-height: 392px; overflow-y: auto; background: #ffffff; border: 1px solid #dde1e6; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #6b7280; text-transform: uppercase;">Armor</div>
      <button onClick="{{openAdd}}" style="padding: 6px 12px; border-radius: 4px; border: 1px solid {{accent}}; background: #fdf3ea; color: {{accent}}; font-size: 12px; font-weight: 600;">+ Add Armor</button>
    </div>
    <sc-if value="{{noItems}}" hint-placeholder-val="{{false}}">
      <div style="font-size: 13px; color: #6b7280; font-style: italic;">No armor yet.</div>
    </sc-if>
    <sc-for list="{{items}}" as="item" hint-placeholder-count="1">
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: #eef0f3; border-radius: 6px; font-size: 14px; color: #1f2430; min-width: 0;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <button aria-label="Edit {{item.name}}" onClick="{{item.edit}}" style="all: unset; cursor: pointer; min-width: 20px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600;">{{item.name}}</button>
          <span style="font-size: 9px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #6b7280; background: #ffffff; border: 1px solid #dde1e6; border-radius: 4px; padding: 2px 5px; flex-shrink: 0;">{{item.armorClass}}</span>
          <sc-if value="{{item.hasDexChip}}" hint-placeholder-val="{{true}}">
            <span style="font-size: 9px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #6b7280; background: #ffffff; border: 1px solid #dde1e6; border-radius: 4px; padding: 2px 5px; flex-shrink: 0;">{{item.dexChip}}</span>
          </sc-if>
          <sc-if value="{{item.hasValue}}" hint-placeholder-val="{{true}}">
            <span style="display: flex; align-items: center; gap: 3px; font-size: 9px; font-weight: 700; letter-spacing: 0.04em; line-height: 12px; color: #7a5b00; background: #fbf3dc; border: 1px solid #e5cf8f; border-radius: 4px; padding: 2px 5px; flex-shrink: 0;"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;">Cost </span>{{item.value}}</span>
          </sc-if>
          <div style="flex-grow: 1;"></div>
          <button aria-label="Delete {{item.name}}" onClick="{{item.remove}}" style="width: 20px; height: 20px; border: none; background: none; color: #6b7280; font-size: 16px; line-height: 1; padding: 0; flex-shrink: 0;">&times;</button>
        </div>
        <div style="font-size: 11px; color: #6b7280; width: 100%; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{item.descShort}}</div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="display: flex; align-items: baseline; gap: 3px; font-size: 9px; font-weight: 700; color: {{accent}}; background: #ffffff; border: 1px solid {{accent}}; border-radius: 4px; padding: 2px 5px; flex-shrink: 0;">
            <span style="font-weight: 400; color: #6b7280;">{{item.acLabel}}</span>
            {{item.ac}}
          </span>
          <div style="flex-grow: 1;"></div>
          <button aria-label="Edit {{item.name}}" title="Edit" onClick="{{item.edit}}" style="position: relative; display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; padding: 0; border: none; background: none; color: #6b7280; flex-shrink: 0;"><span aria-hidden="true" style="position: absolute; top: -4px; bottom: -4px; left: -4px; right: -4px;"></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></button>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{formOpen}}" hint-placeholder-val="{{false}}">
      <div style="border-top: 1px solid #dde1e6; padding-top: 10px; display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 12px; font-weight: 600; color: #1f2430;">{{formTitle}}</div>
        <div style="font-size: 11px; color: #6b7280;">Paste the armor's 5etools-shaped entry. Saving replaces the whole entry; there's no field-by-field editing.</div>
        <label for="armorJson" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Armor JSON</label>
        <textarea id="armorJson" value="{{formJson}}" onChange="{{onFormJsonChange}}" placeholder='{"name": "Duskguard Plate", "source": "HB", "type": "HA", "ac": 18, "value": "400 gp", "entries": ["..."]}' style="width: 100%; min-height: 160px; padding: 8px; border: 1px solid {{accent}}; border-radius: 4px; font-size: 12px; font-family: monospace; background: #ffffff; color: #1f2430; resize: vertical;"></textarea>
        <div style="display: flex; gap: 8px; justify-content: flex-end;">
          <button onClick="{{closeForm}}" style="padding: 6px 12px; border-radius: 4px; border: 1px solid #dde1e6; background: none; color: #1f2430; font-size: 12px; font-weight: 600;">Cancel</button>
          <button onClick="{{saveForm}}" style="padding: 6px 12px; border-radius: 4px; border: none; background: {{accent}}; color: #ffffff; font-size: 12px; font-weight: 600;">Save</button>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c1272d"},"$preview":{"width":480,"height":440}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      items: [
        { id: 'a1', name: 'Duskguard Plate', armorClass: 'Heavy', ac: 18, dexCap: 0, value: '400 gp', json: '{"name": "Duskguard Plate", "source": "HB", "type": "HA", "ac": 18, "value": "400 gp", "entries": ["Blackened plate that dulls sound with every step."]}' }
      ],
      editingId: null,
      addOpen: false,
      formJson: ''
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#c1272d';
    const { items, editingId, addOpen, formJson } = this.state;
    const descOf = (json) => {
      try {
        const parsed = JSON.parse(json);
        if (parsed && Array.isArray(parsed.entries) && parsed.entries.length) return String(parsed.entries[0]);
      } catch {}
      return '';
    };
    const fmt = (n) => (n >= 0 ? '+' + n : String(n));
    const pretty = (json) => {
      try {
        return JSON.stringify(JSON.parse(json), null, 2);
      } catch {
        return json;
      }
    };
    const rows = items.map((it) => ({
      id: it.id,
      name: it.name,
      armorClass: it.armorClass,
      ac: it.ac,
      acLabel: it.armorClass === 'Shield' ? 'AC bonus' : 'AC',
      value: it.value,
      hasValue: !!it.value,
      hasDexChip: it.armorClass !== 'Shield',
      dexChip: it.dexCap === 0 ? 'No DEX' : it.dexCap == null ? 'Full DEX' : 'DEX cap ' + fmt(it.dexCap),
      descShort: descOf(it.json),
      edit: () => this.setState({ editingId: it.id, addOpen: false, formJson: pretty(it.json) }),
      remove: () => this.setState({ items: items.filter((x) => x.id !== it.id), editingId: editingId === it.id ? null : editingId })
    }));
    const editing = items.find((it) => it.id === editingId);
    return {
      accent,
      items: rows,
      noItems: items.length === 0,
      formOpen: addOpen || !!editing,
      formTitle: editing ? 'Edit ' + editing.name : 'New armor',
      formJson,
      onFormJsonChange: (e) => this.setState({ formJson: e.target.value }),
      openAdd: () => this.setState({ addOpen: true, editingId: null, formJson: '' }),
      closeForm: () => this.setState({ addOpen: false, editingId: null, formJson: '' }),
      saveForm: () => {
        let parsedName = 'Untitled Armor', armorClass = 'Light', ac = 11, dexCap = null, value = '';
        const defaultDexCap = { Light: null, Medium: 2, Heavy: 0, Shield: null };
        try {
          const parsed = JSON.parse(formJson);
          if (parsed && parsed.name) parsedName = parsed.name;
          const typeMap = { LA: 'Light', MA: 'Medium', HA: 'Heavy', S: 'Shield' };
          if (parsed && typeMap[parsed.type]) armorClass = typeMap[parsed.type];
          dexCap = defaultDexCap[armorClass];
          if (parsed && typeof parsed.dexCap !== 'undefined') dexCap = parsed.dexCap;
          if (parsed && typeof parsed.ac === 'number') ac = parsed.ac;
          if (parsed && parsed.value) value = String(parsed.value);
        } catch {}
        if (editing) {
          this.setState({ items: items.map((x) => (x.id === editing.id ? { ...x, name: parsedName, armorClass, ac, dexCap, value, json: formJson } : x)), editingId: null, formJson: '' });
        } else {
          this.setState({ items: [...items, { id: 'a' + Date.now(), name: parsedName, armorClass, ac, dexCap, value, json: formJson }], addOpen: false, formJson: '' });
        }
      }
    };
  }
}
</script>
</body>
</html>
