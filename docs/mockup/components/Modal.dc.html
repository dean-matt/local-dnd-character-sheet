<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reference — Modal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
</style>
</helmet>

<div style="width: 460px; height: 420px; box-sizing: border-box; padding: 32px; display: flex; align-items: center; background: #f4f5f7; position: relative;">
  <div style="width: 100%; height: 100%; background: #ffffff; border: 1px solid #dde1e6; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px;">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #6b7280; text-transform: uppercase;">Click-to-open modal — shown open for review</div>
    <button onClick="{{reopen}}" style="padding: 6px 14px; border-radius: 4px; border: 1px solid #dde1e6; background: #eceef1; color: #1f2430; font-size: 12px; font-weight: 600;">Reopen</button>
  </div>
  <sc-if value="{{open}}" hint-placeholder-val="{{true}}">
    <div role="presentation" onClick="{{close}}" style="position: fixed; inset: 0; background: rgba(15,17,21,0.5); display: flex; align-items: center; justify-content: center; z-index: 50;">
      <div role="dialog" aria-modal="true" aria-label="Stealth" onClick="{{stopPropagation}}" style="background: #ffffff; border-radius: 10px; padding: 20px; width: min(320px, 85%); max-height: 80%; overflow: auto; box-shadow: 0 12px 32px rgba(0,0,0,0.3);">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px;">
          <div style="font-size: 15px; font-weight: 700;">Stealth</div>
          <button aria-label="Close" onClick="{{close}}" style="width: 24px; height: 24px; border: none; background: none; cursor: pointer; color: #6b7280; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
        </div>
        <div style="font-size: 26px; font-weight: 700; color: #c1272d; margin-bottom: 10px;">+8</div>
        <div style="font-size: 12px; color: #6b7280; margin-bottom: 10px;">DEX modifier +4 + proficiency +4 = +8</div>
        <div style="font-size: 13px; color: #1f2430; line-height: 1.5;">Conceal yourself, move silently, or slip away unseen.</div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":460,"height":420}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true };
  }
  renderVals() {
    return {
      open: this.state.open,
      close: () => this.setState({ open: false }),
      reopen: () => this.setState({ open: true }),
      stopPropagation: (e) => e.stopPropagation()
    };
  }
}
</script>
</body>
</html>
