<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget — Class</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }
  input::placeholder { color: #9aa1ab; }
  input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }
</style>
</helmet>

<div style="width: 320px; height: 220px; box-sizing: border-box; padding: 24px; display: flex; align-items: center; background: #f4f5f7;">
  <div style="width: 100%; background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; padding: 16px;">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase; margin-bottom: 8px;">Class</div>

    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;">
      <sc-if value="{{noClasses}}" hint-placeholder-val="{{false}}">
        <div style="font-size: 12px; color: #6b7280; font-style: italic;">Choose a class below.</div>
      </sc-if>
      <sc-for list="{{classes}}" as="c" hint-placeholder-count="1">
        <div style="display: flex; align-items: center; gap: 4px; font-size: 13px; padding: 4px 4px 4px 12px; border-radius: 999px; background: #eceef1; border: 1px solid #dde1e6; color: #1f2430;">
          {{c.name}}
          <label for="classLevel-{{c.id}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">{{c.name}} level</label>
          <input id="classLevel-{{c.id}}" type="number" min="1" max="20" value="{{c.level}}" onChange="{{c.onLevel}}" title="Level in {{c.name}}" style="width: 30px; padding: 2px; border: none; background: none; text-align: center; font-size: 13px; font-weight: 600; color: {{accent}};">
          <button aria-label="Remove {{c.name}}" onClick="{{c.remove}}" style="width: 16px; height: 16px; border: none; background: none; color: #6b7280; font-size: 13px; line-height: 1; padding: 0;">&times;</button>
        </div>
      </sc-for>
    </div>

    <div style="font-size: 11px; color: #6b7280; margin-bottom: 8px;" title="Sum of each class's level">Total level: {{totalLevel}}</div>

    <sc-if value="{{hasOptions}}" hint-placeholder-val="{{true}}">
      <div style="position: relative;">
        <label for="classSearch" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Add a class</label>
        <input id="classSearch" type="text" placeholder="Add a class…" value="{{query}}" onChange="{{onQueryChange}}" style="width: 100%; padding: 7px 10px; border: 1px solid #dde1e6; border-radius: 8px; font-size: 13px; background: #ffffff; color: #1f2430;">
        <div style="position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; box-shadow: 0 16px 32px rgba(0, 0, 0, 0.18); padding: 6px; max-height: 200px; overflow-y: auto; z-index: 30;">
          <sc-for list="{{matches}}" as="m" hint-placeholder-count="4">
            <button onClick="{{m.pick}}" style="display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; border: none; background: none; font-size: 13px; color: #1f2430;">{{m.name}}</button>
          </sc-for>
          <sc-if value="{{noMatches}}" hint-placeholder-val="{{false}}">
            <div style="font-size: 12px; color: #6b7280; padding: 8px 10px;">No matching class.</div>
          </sc-if>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{noOptions}}" hint-placeholder-val="{{false}}">
      <div style="font-size: 12px; color: #6b7280; font-style: italic;">Every class has been added.</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c1272d"},"$preview":{"width":320,"height":220}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { classes: [{ id: 'ranger', name: 'Ranger', level: 7 }], query: '' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#c1272d';
    const ALL_CLASSES = ['Barbarian', 'Bard', 'Cleric', 'Druid', 'Fighter', 'Monk', 'Paladin', 'Ranger', 'Rogue', 'Sorcerer', 'Warlock', 'Wizard'];
    const { classes, query } = this.state;
    const taken = classes.map((c) => c.name);
    const available = ALL_CLASSES.filter((name) => taken.indexOf(name) === -1);
    const q = query.trim().toLowerCase();
    const matches = (q ? available.filter((name) => name.toLowerCase().indexOf(q) !== -1) : available).map((name) => ({
      name,
      pick: () => this.setState({ classes: [...classes, { id: name.toLowerCase(), name, level: 1 }], query: '' })
    }));
    const classRows = classes.map((c) => ({
      id: c.id,
      name: c.name,
      level: c.level,
      onLevel: (e) => this.setState({ classes: classes.map((x) => (x.id === c.id ? { ...x, level: Math.max(1, Math.min(20, parseInt(e.target.value, 10) || 1)) } : x)) }),
      remove: () => this.setState({ classes: classes.filter((x) => x.id !== c.id) })
    }));
    return {
      accent,
      classes: classRows,
      noClasses: classes.length === 0,
      totalLevel: classes.reduce((sum, c) => sum + c.level, 0),
      hasOptions: available.length > 0,
      noOptions: available.length === 0,
      query,
      onQueryChange: (e) => this.setState({ query: e.target.value }),
      matches,
      noMatches: matches.length === 0
    };
  }
}
</script>
</body>
</html>
