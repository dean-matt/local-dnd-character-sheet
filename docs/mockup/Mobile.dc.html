<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Character Sheet — Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #f4f5f7; font-family: 'Noto Sans', sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
</style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f4f5f7;">

  <div style="flex-grow: 1; overflow-y: auto; padding: 20px 18px 12px 18px; display: flex; flex-direction: column; gap: 16px;">

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 52px; height: 52px; border-radius: 50%; background: {{accent}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 22px; flex-shrink: 0;">E</div>
      <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
        <div style="font-weight: 700; font-size: 20px; color: #1f2430;">Elara Nightshade</div>
        <div style="font-size: 12px; color: #6b7280;">Half-Elf Ranger &bull; Level 7</div>
      </div>
    </div>

    <div style="background: #ffffff; border: 1px solid #dde1e6; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #6b7280; text-transform: uppercase;">Hit Points</div>
        <div style="font-size: 11px; color: #6b7280;">Hit Dice 7d10</div>
      </div>
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <div style="font-size: 24px; font-weight: 700;">54</div>
        <div style="font-size: 14px; color: #6b7280;">/ 58</div>
      </div>
      <div style="width: 100%; height: 8px; border-radius: 999px; background: #eceef1; overflow: hidden;">
        <div style="width: 93%; height: 100%; background: {{accent}};"></div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
      <div style="background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <div style="font-size: 9px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase;">AC</div>
        <div style="font-size: 22px; font-weight: 700;">15</div>
      </div>
      <div style="background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <div style="font-size: 9px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase;">Init</div>
        <div style="font-size: 22px; font-weight: 700;">+4</div>
      </div>
      <div style="background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <div style="font-size: 9px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280; text-transform: uppercase;">Speed</div>
        <div style="font-size: 22px; font-weight: 700;">35</div>
      </div>
    </div>

    <div>
      <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #6b7280; text-transform: uppercase; margin-bottom: 8px;">Ability Scores</div>
      <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px;">
        <sc-for list="{{abilityRows}}" as="ab" hint-placeholder-count="6">
          <div style="flex-shrink: 0; width: 56px; background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; padding: 8px 0 10px 0; display: flex; flex-direction: column; align-items: center; gap: 3px;">
            <div style="font-size: 9px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280;">{{ab.label}}</div>
            <div style="font-size: 18px; font-weight: 700;">{{ab.score}}</div>
            <div style="font-size: 10px; font-weight: 600; color: #ffffff; background: {{accent}}; border-radius: 999px; padding: 0px 7px;">{{ab.mod}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div>
      <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #6b7280; text-transform: uppercase; margin-bottom: 8px;">Top Skills</div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <sc-for list="{{topSkills}}" as="sk" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 8px 12px; background: #ffffff; border: 1px solid #dde1e6; border-radius: 8px;">
            <div style="width: 8px; height: 8px; border-radius: 50%; background: {{accent}}; flex-shrink: 0;"></div>
            <div style="flex-grow: 1; color: #1f2430;">{{sk.label}}</div>
            <div style="font-weight: 600; color: #1f2430;">{{sk.bonus}}</div>
          </div>
        </sc-for>
      </div>
    </div>

  </div>

  <div style="flex-shrink: 0; display: flex; border-top: 1px solid #dde1e6; background: #ffffff;">
    <sc-for list="{{navItems}}" as="nav" hint-placeholder-count="4">
      <div style="flex: 1; text-align: center; padding: 10px 0 12px 0; font-size: 11px; font-weight: {{nav.weight}}; color: {{nav.color}}; border-top: {{nav.indicator}};">{{nav.label}}</div>
    </sc-for>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c1272d","options":["#c1272d","#3f5d44","#3a4f7a","#7a3b53"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? "#c1272d";

    const abilityRows = [
      { key: "str", label: "STR", score: 13, mod: "+1" },
      { key: "dex", label: "DEX", score: 18, mod: "+4" },
      { key: "con", label: "CON", score: 14, mod: "+2" },
      { key: "int", label: "INT", score: 10, mod: "+0" },
      { key: "wis", label: "WIS", score: 16, mod: "+3" },
      { key: "cha", label: "CHA", score: 8, mod: "-1" }
    ];

    const topSkills = [
      { label: "Perception", bonus: "+7" },
      { label: "Stealth", bonus: "+8" },
      { label: "Survival", bonus: "+7" },
      { label: "Animal Handling", bonus: "+7" }
    ];

    const navDefs = [
      { id: "overview", label: "Overview" },
      { id: "inventory", label: "Inventory" },
      { id: "spells", label: "Spells" },
      { id: "notes", label: "Notes" }
    ];
    const navItems = navDefs.map((n) => {
      const active = n.id === "overview";
      return {
        label: n.label,
        color: active ? "#1f2430" : "#6b7280",
        weight: active ? "600" : "500",
        indicator: active ? "2px solid " + accent : "2px solid transparent"
      };
    });

    return { accent, abilityRows, topSkills, navItems };
  }
}
</script>
</body>
</html>
