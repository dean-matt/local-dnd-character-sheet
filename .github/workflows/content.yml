name: content

# The checks here read vendor/5etools/, which is WotC's data and is never committed.
# Fetching 109 MB on every pull request is the wrong trade, so a pull request runs them
# only when it moves the pin.
#
# The schedule covers what that leaves open. A loader, the tag parser and the tag audit
# meet the real corpus here and a fixture subset under `pnpm test`, so a break on a file
# the fixtures elide merges green — the nightly run catches it while the commit that
# caused it is still the last one in, rather than at the next tag bump months later. It
# also re-verifies the pin, which is the only way an upstream retag surfaces before a
# local change asks about it. `workflow_dispatch` answers the loader change that cannot
# wait for the night.
on:
  schedule:
    # Off the hour, where a scheduled run queues behind every other repository's.
    - cron: "17 7 * * *"
  pull_request:
    paths:
      # A sync with no `--tag` rewrites the lockfile and leaves the manifest alone, so the
      # lockfile is the only file a re-fetch of the same tag moves. The workflow itself is
      # here so the pull request that changes a step is the one that runs it.
      - content.manifest.json
      - content.lock.json
      - .github/workflows/content.yml
  workflow_dispatch:

concurrency:
  group: content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The sync clones a third-party repository from inside this checkout, so a persisted
      # token would ride along on that clone. Nothing here needs git credentials: the
      # restore is local and the clone is public.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch the pinned tag
        run: pnpm content:sync

      # The fetch rewrites content.lock.json, so verifying against it would compare the
      # fetch to itself. Restoring the committed lockfile first makes `--verify` answer
      # the question worth asking: does the pinned tag still hash to what the bump
      # recorded?
      - name: Verify the fetch against the committed lockfile
        run: |
          git checkout -- content.lock.json
          pnpm content:sync --verify

      - name: Build content.db from the real corpus
        run: pnpm content:build

      - name: Check the fixtures still say what the declaration generates
        run: pnpm fixtures:build --check

      - name: Audit every tag in the corpus
        run: pnpm tags:audit
