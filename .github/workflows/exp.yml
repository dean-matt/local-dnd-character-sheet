name: exp

on:
  pull_request:

concurrency:
  group: exp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: ${{ matrix.variant }} ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [base]
        total: [2, 3, 4, 6]
        shard: [1, 2, 3, 4, 5, 6]
        include:
          - { variant: tmp-defender, total: 4, shard: 1 }
          - { variant: tmp-defender, total: 4, shard: 2 }
          - { variant: tmp-defender, total: 4, shard: 3 }
          - { variant: tmp-defender, total: 4, shard: 4 }
          - { variant: devdrive, total: 4, shard: 1 }
          - { variant: devdrive, total: 4, shard: 2 }
          - { variant: devdrive, total: 4, shard: 3 }
          - { variant: devdrive, total: 4, shard: 4 }
        exclude:
          - { total: 2, shard: 3 }
          - { total: 2, shard: 4 }
          - { total: 2, shard: 5 }
          - { total: 2, shard: 6 }
          - { total: 3, shard: 4 }
          - { total: 3, shard: 5 }
          - { total: 3, shard: 6 }
          - { total: 4, shard: 5 }
          - { total: 4, shard: 6 }
    steps:
      - uses: actions/checkout@v7

      - if: matrix.variant == 'devdrive'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          env-mapping: |
            TEMP,{{ DEV_DRIVE }}/tmp
            TMP,{{ DEV_DRIVE }}/tmp

      - if: matrix.variant == 'devdrive'
        shell: pwsh
        run: New-Item -ItemType Directory -Force $env:TEMP

      - if: matrix.variant == 'tmp-defender'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:TEMP

      - uses: ./.github/actions/setup

      - name: Test
        run: pnpm test --shard=${{ matrix.shard }}/${{ matrix.total }}
