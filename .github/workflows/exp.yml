name: exp

on:
  pull_request:

concurrency:
  group: exp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: ${{ matrix.variant }} ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: base, total: 4, shard: 1 }
          - { variant: base, total: 4, shard: 2 }
          - { variant: base, total: 4, shard: 3 }
          - { variant: base, total: 4, shard: 4 }
          - { variant: base, total: 8, shard: 1 }
          - { variant: base, total: 8, shard: 2 }
          - { variant: base, total: 8, shard: 3 }
          - { variant: base, total: 8, shard: 4 }
          - { variant: base, total: 8, shard: 5 }
          - { variant: base, total: 8, shard: 6 }
          - { variant: base, total: 8, shard: 7 }
          - { variant: base, total: 8, shard: 8 }
          - { variant: base, total: 10, shard: 1 }
          - { variant: base, total: 10, shard: 2 }
          - { variant: base, total: 10, shard: 3 }
          - { variant: base, total: 10, shard: 4 }
          - { variant: base, total: 10, shard: 5 }
          - { variant: base, total: 10, shard: 6 }
          - { variant: base, total: 10, shard: 7 }
          - { variant: base, total: 10, shard: 8 }
          - { variant: base, total: 10, shard: 9 }
          - { variant: base, total: 10, shard: 10 }
          - { variant: base, total: 12, shard: 1 }
          - { variant: base, total: 12, shard: 2 }
          - { variant: base, total: 12, shard: 3 }
          - { variant: base, total: 12, shard: 4 }
          - { variant: base, total: 12, shard: 5 }
          - { variant: base, total: 12, shard: 6 }
          - { variant: base, total: 12, shard: 7 }
          - { variant: base, total: 12, shard: 8 }
          - { variant: base, total: 12, shard: 9 }
          - { variant: base, total: 12, shard: 10 }
          - { variant: base, total: 12, shard: 11 }
          - { variant: base, total: 12, shard: 12 }
    steps:
      - uses: actions/checkout@v7

      - if: false
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          env-mapping: |
            TEMP,{{ DEV_DRIVE }}/tmp
            TMP,{{ DEV_DRIVE }}/tmp

      - if: false
        shell: pwsh
        run: New-Item -ItemType Directory -Force $env:TEMP

      - if: false
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:TEMP

      - uses: ./.github/actions/setup

      - name: Test
        run: pnpm test --shard=${{ matrix.shard }}/${{ matrix.total }}
