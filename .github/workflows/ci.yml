name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm exec biome check .

      - name: Dead code
        run: pnpm deadcode

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned, unlike teh actions above, because this entrypoint downloads the typos
      # release its ref names. A moving ref takes whatever upstream tagged last, which
      # can be minutes before its release assets exist, and the download 404s before a
      # file is read. Dependabot raises the version once a month; the pin is what
      # makes that a reviewed change rather than a surprise.
      - uses: crate-ci/typos@v1.50.2

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No --with-deps: it runs apt-get update, and the runner image carries
      # Google's Chrome repo, so an index they publish badly fails the job before
      # a test runs. The image already ships the libraries Chromium needs.
      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
