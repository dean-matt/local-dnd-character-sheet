name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing here depends on the OS, so it runs once rather than beside every shard.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm exec biome check .

      - name: Dead code
        run: pnpm deadcode

      - name: Build
        run: pnpm build

  # The shard list's length is the shard count. Past four, each runner's fixed setup
  # outweighs the test time it saves.
  test-ubuntu:
    name: test (ubuntu-latest, ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps: &test-steps
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Test
        run: pnpm test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # Windows runs the content tests about 25 times slower than Linux, so its shard count
  # follows the suite: one shard per 30 test files, so run time holds as tests are added.
  # Measured at 4, 6, 8, 10 and 12 shards, a shard costs about 55 s of setup plus its tests,
  # and the slowest fell from 134 s at 4 to 95 s at 8 but only to 84 s at 12, where the
  # largest single files set the floor. The cap is 16 to stay under the free plan's 20
  # concurrent jobs beside the other jobs; past it, raise the files per shard.
  plan-windows:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        run: |
          files=$(git ls-files '*.test.ts' '*.test.tsx' | wc -l)
          n=$(( (files + 29) / 30 ))
          n=$(( n < 2 ? 2 : n > 16 ? 16 : n ))
          echo "shards=$(jq -nc --argjson n "$n" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"

  test-windows:
    name: test (windows-latest, ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [plan-windows]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan-windows.outputs.shards) }}
    steps: *test-steps

  # The ruleset requires these two names, so each stands for its OS's shards. always()
  # makes a red or cancelled shard report here as a failure, where a skipped job would
  # read as green to the ruleset and to the merge gate alike.
  check-ubuntu:
    name: check (ubuntu-latest)
    needs: [static, test-ubuntu]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: for r in ${{ join(needs.*.result, ' ') }}; do echo "$r"; [ "$r" = success ] || exit 1; done

  check-windows:
    name: check (windows-latest)
    needs: [plan-windows, test-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: for r in ${{ join(needs.*.result, ' ') }}; do echo "$r"; [ "$r" = success ] || exit 1; done

  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned, unlike the actions above, because this entrypoint downloads the typos
      # release its ref names. A moving ref takes whatever upstream tagged last, which
      # can be minutes before its release assets exist, and the download 404s before a
      # file is read. Dependabot raises the version once a month; the pin is what
      # makes that a reviewed change rather than a surprise.
      - uses: crate-ci/typos@v1.51.1

  # Shards, not more workers: a runner's 4 vCPUs also host both servers, and 4 workers
  # ran slower than 2 and timed out saves.
  e2e-shard:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # No --with-deps: it runs apt-get update, and the runner image carries
      # Google's Chrome repo, so an index they publish badly fails the job before
      # a test runs. The image already ships the libraries Chromium needs.
      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: End-to-end tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The ruleset requires `e2e` by name, so it stands for the shards as `check (<os>)` does.
  e2e:
    needs: [e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: for r in ${{ join(needs.*.result, ' ') }}; do echo "$r"; [ "$r" = success ] || exit 1; done
