name: Bug
description: Something behaves incorrectly
labels: ["type:fix"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Summary
      description: Expected vs actual, the problem first.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The shortest path to seeing it.
    validations:
      required: true

  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: Anything unresolved that blocks starting. Leave empty if none.

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What should NOT be touched.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes once fixed, numbered AC1, AC2 and so on.
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [rules, character, dice, tags, content, api, web, repo, docs]
    validations:
      required: true

  - type: input
    id: content-tag
    attributes:
      label: Upstream tag
      description: From content.lock.json, if the bug involves rules data.
