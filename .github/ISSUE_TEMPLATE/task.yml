name: Task
description: A unit of work — a feature, a change, or a chore
labels: ["type:feat"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: The problem first, in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: Anything unresolved that blocks starting. Leave empty if none.
      placeholder: "- [ ] Which edition wins when both define the row?"

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What should NOT be touched.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, checkable outcomes, numbered AC1, AC2 and so on.
      value: |
        AC1.
        AC2.
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - rules
        - character
        - dice
        - tags
        - content
        - api
        - web
        - repo
        - docs
    validations:
      required: true
